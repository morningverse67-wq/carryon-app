<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarryOn</title>
<meta name="description" content="See how full every AI agent session is, and back up and compact the full ones before they run out of room.">
<link rel="alternate" hreflang="en" href="https://carryon-app.pages.dev/?lang=en">
<link rel="alternate" hreflang="ko" href="https://carryon-app.pages.dev/?lang=ko">
<link rel="alternate" hreflang="ja" href="https://carryon-app.pages.dev/?lang=ja">
<link rel="alternate" hreflang="zh" href="https://carryon-app.pages.dev/?lang=zh">
<link rel="alternate" hreflang="de" href="https://carryon-app.pages.dev/?lang=de">
<link rel="alternate" hreflang="fr" href="https://carryon-app.pages.dev/?lang=fr">
<link rel="alternate" hreflang="es" href="https://carryon-app.pages.dev/?lang=es">
<link rel="alternate" hreflang="it" href="https://carryon-app.pages.dev/?lang=it">
<link rel="alternate" hreflang="nl" href="https://carryon-app.pages.dev/?lang=nl">
<link rel="alternate" hreflang="pt" href="https://carryon-app.pages.dev/?lang=pt">
<link rel="alternate" hreflang="x-default" href="https://carryon-app.pages.dev/">
<link rel="canonical" href="https://carryon-app.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://carryon-app.pages.dev/">
<meta property="og:title" content="CarryOn: every AI session at a glance">
<meta property="og:description" content="A free macOS menu-bar app that shows how full each Claude Code, Codex, Aside and Gemini CLI session is, and backs up and compacts the full ones before they run out of room.">
<meta property="og:image" content="https://carryon-app.pages.dev/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="img/favicon.png?v=otter">
<style>
:root{color-scheme:light dark;
--bg:#F7F7F5;--surface:#FFFFFF;--sunken:#F0F1F3;--line:#E2E3E7;--text:#111317;--muted:#3E4350;--faint:#585E6B;--accent:#1652C4;
--btn:#1A5BD0;--btn-hover:#1450BC;--toc-on:rgba(215,221,229,.7);--fill:#D3E2FF;--orange:#B23E0B;--ring-o:#EA6A1F;--ring-y:#E0A800;--green:#1C8C43;--neutral:#7A808C;--track:#E4E6EA;
--glow:rgba(26,91,208,.16);--shadow:0 1px 2px rgba(17,19,23,.05),0 28px 56px -28px rgba(17,19,23,.32);--bar-bg:rgba(247,247,245,.84);
--bar:60px;--tocbar:62px;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
--bg:#121110;--surface:#1A1917;--sunken:#211F1D;--line:#302E2A;--text:#F2F3F5;--muted:#C3C7CF;--faint:#A2A8B3;--accent:#86AEFF;
--btn:#2563EB;--btn-hover:#1D4ED8;--toc-on:rgba(170,160,145,.2);--fill:#1C3A72;--orange:#FF9A52;--ring-o:#F97316;--ring-y:#FFCC00;--green:#3DD068;--neutral:#9AA0AB;--track:#302E2A;
--glow:rgba(59,116,240,.24);--shadow:0 1px 2px rgba(0,0,0,.4),0 28px 56px -28px rgba(0,0,0,.8);--bar-bg:rgba(18,17,16,.82)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font:400 18px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
[lang|=ko]{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
[lang|=ja]{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
[lang|=zh]{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
:lang(ko){word-break:keep-all}
:lang(ja),:lang(zh){line-break:strict}
:lang(ja){word-break:auto-phrase}
:lang(zh) :is(h1,h2,h3){word-break:keep-all}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}
a{color:var(--accent)}
img{max-width:100%}
main{overflow-x:clip}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--fill);color:var(--text)}
.wrap{width:min(1280px,100% - 64px);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:inherit;text-decoration:none;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand img{border-radius:7px}
#lang{font:inherit;font-size:14px;font-weight:550;line-height:1.2;color:var(--text);background:var(--sunken);border:1px solid var(--line);border-radius:10px;padding:7px 8px;cursor:pointer}
#lang:hover{border-color:var(--faint)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--btn);color:#fff;text-decoration:none;font-weight:650;border-radius:12px;transition:background-color .15s}
.btn:hover{background:var(--btn-hover)}
.btn svg{width:19px;height:19px;flex:none}
.btn-s{font-size:15px;line-height:1.2;padding:8px 15px 8px 13px;border-radius:10px}
.btn-s svg{width:16px;height:16px}
.btn-l{font-size:18px;padding:16px 28px 16px 24px}
.btn-o{display:inline-flex;align-items:center;justify-content:center;flex:none;background:var(--surface);color:var(--text);border:1px solid var(--neutral);text-decoration:none;font-family:inherit;font-weight:600;line-height:1.2;cursor:pointer;transition:background-color .15s}
.btn-o:hover{background:var(--sunken)}
.btn-o.btn-s{font-size:15px;padding:8px 15px}

/* hero: one centered column, the window below it */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;padding-block:96px 112px}
h1{font-size:clamp(44px,5vw,68px);line-height:1.06;letter-spacing:-.035em;font-weight:760;margin:0 0 20px}
:is(:lang(ko),:lang(ja),:lang(zh)) h1{font-size:clamp(38px,4.4vw,60px);line-height:1.2;letter-spacing:-.02em}
.lede{font-size:clamp(18px,1.5vw,20px);color:var(--muted);margin:0 0 36px;max-width:34em;text-wrap:balance}
.meta{margin:16px 0 0;font-size:15px;color:var(--faint)}
.hero-shot{position:relative;isolation:isolate;width:min(100%,1040px);margin-top:80px}
.hero-shot::before{content:"";position:absolute;inset:-14% -10%;z-index:-1;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero-shot img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.hero-shot img{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* get started, updates: a heading on the left, cards of "name ─ [button]" lines on the right */
.row{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:56px;margin:0;min-height:0;padding-block:72px;border-top:1px solid var(--line)}
.row:last-child{margin-bottom:0}
.row-head p{margin:0;color:var(--muted);max-width:22em}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;align-items:start}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:28px}
.card>p{margin:0;color:var(--muted);font-size:16px;line-height:1.6}
.lines{list-style:none;margin:24px 0 0;padding:0}
.lines>li{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;padding-block:12px;border-top:1px solid var(--line);font-weight:600;line-height:1.4}
.lines>li:last-child{padding-bottom:0}
.lines>li.block{display:block}
.line-top{display:flex;align-items:center;justify-content:space-between;gap:16px}
.small{margin:10px 0 14px;color:var(--muted);font-size:15px;font-weight:400;line-height:1.55}
.card .steps{margin-top:24px;gap:16px}
.card .steps li{font-size:16px;line-height:1.55}
.card .small:last-child{margin-bottom:0;margin-top:20px}

/* table of contents + sections */
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px;align-items:start;padding-top:96px;border-top:1px solid var(--line)}
.toc{position:sticky;top:calc(var(--bar) + 32px)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.toc a{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 11px;border-radius:11px;color:var(--text);text-decoration:none;font-size:15px;font-weight:500;line-height:1.3}
.toc a:hover{background:var(--sunken);transition-duration:.15s}
.toc a[aria-current]{background:var(--toc-on)}
.toc svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* the fill: a blue copy of the icon and label over the item, shown from the left as far as the section has been read */
.toc .fill{position:absolute;inset:0;display:flex;align-items:center;gap:inherit;padding:inherit;border-radius:inherit;background:var(--btn);color:#fff;pointer-events:none;visibility:hidden;clip-path:inset(0 calc(100% - var(--p,0)*100%) 0 0)}
.toc .read .fill{visibility:visible}
@media (prefers-reduced-motion:no-preference){.toc a{transition:background-color .5s}.toc .fill{transition:clip-path .2s}}
/* tall enough that, reached from the table of contents, the next section starts below the middle of the window (the baseline) */
section{margin-bottom:120px;scroll-margin-top:calc(var(--bar) + 32px);min-height:calc(50vh - var(--bar) - 148px)}
section:last-child{margin-bottom:88px}
h2{font-size:clamp(28px,3vw,40px);line-height:1.18;letter-spacing:-.028em;font-weight:730;margin:0 0 14px}
:is(:lang(ko),:lang(ja),:lang(zh)) h2{line-height:1.32;letter-spacing:-.015em}
h3{font-size:20px;line-height:1.35;letter-spacing:-.01em;font-weight:680;margin:0 0 6px}
.intro{margin:0 0 36px;color:var(--muted);max-width:34em}
:is(:lang(ko),:lang(ja),:lang(zh)) .intro{max-width:36em}

/* screenshots: the hero's own window image, cropped (--x --y --w --h in its 1640 px) */
.shot{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sunken);box-shadow:0 1px 2px rgba(17,19,23,.05),0 18px 40px -26px rgba(17,19,23,.35)}
.shot img{display:block;width:100%;height:auto}
.crop{position:relative;aspect-ratio:var(--w)/var(--h)}
.crop img{position:absolute;max-width:none;width:calc(1640/var(--w)*100%);left:calc(var(--x)/var(--w)*-100%);top:calc(var(--y)/var(--h)*-100%)}
.c-list{--x:16;--y:128;--w:790;--h:982;max-width:440px}
.dark-shot{max-width:440px;border-color:#2A2D34;background:#282828}
.crop-free{max-width:460px}

.duo{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:24px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:48px;align-items:center}
.split .intro{margin-bottom:0}
.stack{display:grid;gap:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.tile p{margin:0;color:var(--muted);font-size:17px;line-height:1.65}
.viz{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;min-height:132px;margin-bottom:20px;padding:20px;border-radius:14px;background:var(--sunken)}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}

/* rings, as the app draws them */
.ring{display:block;width:64px;height:64px}
.ring svg{display:block;width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--track);stroke-width:4.5}
.ring .arc{fill:none;stroke:var(--neutral);stroke-width:4.5;stroke-linecap:round}
.ring text{font:700 13px var(--sans);fill:var(--text);letter-spacing:-.02em}
.ring tspan{font-size:8px}
.o .arc{stroke:var(--ring-o)}
.y .arc{stroke:var(--ring-y)}
.g .arc{stroke:var(--green)}
.legend{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px}
.legend li{display:flex;align-items:center;gap:14px;font-size:17px;line-height:1.45;color:var(--muted)}
.legend li.o{color:var(--orange);font-weight:600}
.legend .ring{width:56px;height:56px;flex:none}
.ba-ring{width:84px;height:84px}
.viz>svg{width:26px;height:26px;fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .ba-label{color:var(--text);font-weight:650;margin-bottom:6px}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.notes li{position:relative;padding-left:22px;color:var(--muted);font-size:17px;line-height:1.65}
.notes li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips li{padding:6px 13px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);font-size:15px;font-weight:550;color:var(--text);white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--faint);font-size:16px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.allrow{display:flex;justify-content:space-between;width:100%;font-size:15px;color:var(--muted)}
kbd{font:inherit;color:var(--faint)}
.notif{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -14px rgba(0,0,0,.4);font-size:15px;line-height:1.45}
.notif img{border-radius:8px;flex:none}
.notif b{display:block;color:var(--text)}
.notif span{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center;width:100%;font-size:14px;color:var(--faint)}
.kv i,.mrow i{display:block;height:8px;border-radius:4px;background:var(--line)}
.kv i.on{background:var(--faint)}
.menu{display:grid;gap:2px;width:100%;max-width:250px;padding:6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -14px rgba(0,0,0,.4);font-size:14px;line-height:1.35;color:var(--text)}
.menu>span,.menu>b{padding:3px 8px}
.menu>b{font-size:12px;font-weight:600;color:var(--faint)}
.menu hr{width:calc(100% - 16px);margin:4px 8px;border:0;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mrow i{flex:1}
.mrow .ring{width:16px;height:16px;flex:none}
.mrow .ring circle{stroke-width:7}
.mrow .ring text{display:none}
.langs{display:grid;grid-template-columns:repeat(2,auto);gap:6px 28px;font-size:22px;font-weight:650;letter-spacing:-.01em}

/* install */
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:20px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;color:var(--muted)}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--line);color:var(--text);font-size:15px;font-weight:700;line-height:1;margin-top:-1px}
b{color:var(--text);font-weight:650}
.term{border-radius:12px;overflow:hidden;background:#15171B;color:#E8EAED;border:1px solid #2A2D34}
.term code{display:block;padding:14px 16px;font:14px/1.65 var(--mono);font-weight:400;overflow-x:auto}
.term code span{white-space:nowrap}  /* breaks only at the spaces, never inside the address */
@media (prefers-color-scheme:dark){.term{background:#0A0908;border-color:#3A3733}}

/* privacy */
.checks{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:14px}
.pnote{margin-bottom:24px;max-width:44em}
.checks li{position:relative;padding-left:40px;font-size:19px;font-weight:650;line-height:1.5}
.checks li::before{content:"";position:absolute;left:0;top:.12em;width:26px;height:26px;border-radius:50%;background:var(--fill)}
.checks li::after{content:"";position:absolute;left:10px;top:.32em;width:6px;height:11px;border:solid var(--accent);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
details{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 22px;max-width:44em}
summary{cursor:pointer;padding:16px 0;font-weight:650}
details p{margin:0 0 20px;color:var(--muted);font-size:17px}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding-block:32px 48px;border-top:1px solid var(--line);color:var(--faint);font-size:15px}
.foot p{margin:0}
.foot .made{display:flex;align-items:center;gap:10px}
.foot img{border-radius:5px}

@media (max-width:1300px){
.row{grid-template-columns:minmax(0,1fr);gap:28px;padding-block:56px}
.row-head p{max-width:36em}
}
@media (max-width:1000px){.cards{grid-template-columns:minmax(0,1fr)}}
@media (max-width:1080px){
.hero{padding-block:72px 88px}
.hero-shot{margin-top:56px}
.docs{padding-top:72px}
.docs{grid-template-columns:204px minmax(0,1fr);gap:36px}
.duo,.split{grid-template-columns:minmax(0,1fr)}
.split{gap:28px}
}
@media (max-width:900px){.bento{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
:root{--bar:56px}
body{font-size:17.5px}
.wrap{width:calc(100% - 32px)}
.bar :is(.btn,.btn-o){display:none}
.hero{padding-block:48px 56px}
h1{font-size:clamp(36px,10.5vw,44px)}
:is(:lang(ko),:lang(ja),:lang(zh)) h1{font-size:clamp(32px,9vw,40px)}
.lede{margin-bottom:28px}
.hero-shot{margin-top:40px}
.row{padding-block:48px;scroll-margin-top:calc(var(--bar) + 8px)}
.card{padding:22px}
.docs{padding-top:48px}
.btn-l{width:100%}
.hero-shot img{border-radius:18px}
.docs{display:block}
.toc{z-index:15;top:var(--bar);margin:0 -16px 36px;padding:10px 16px;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.toc::-webkit-scrollbar{display:none}
.toc ol{display:flex;gap:8px;width:max-content}
.toc a{min-height:40px;padding:0 14px;gap:8px;white-space:nowrap;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.toc a[aria-current]{box-shadow:none}
.toc svg{width:18px;height:18px}
section{margin-bottom:96px;scroll-margin-top:calc(var(--bar) + var(--tocbar) + 16px);min-height:calc(50vh - var(--bar) - var(--tocbar) - 108px)}
.tile{padding:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
<a class="brand" href="#"><img src="img/icon.png?v=otter" width="28" height="28" alt=""><span>CarryOn</span></a>
<select id="lang" data-a="langLabel"><option value="en" lang="en">English</option><option value="ko" lang="ko">한국어</option><option value="ja" lang="ja">日本語</option><option value="zh" lang="zh">中文</option><option value="de" lang="de">Deutsch</option><option value="fr" lang="fr">Français</option><option value="es" lang="es">Español</option><option value="it" lang="it">Italiano</option><option value="nl" lang="nl">Nederlands</option><option value="pt" lang="pt-BR">Português</option></select>
<!-- /download counts the download, then sends it on to the newest GitHub release; its dmg asset must be named CarryOn.dmg -->
<a class="btn-o btn-s" href="https://github.com/morningverse67-wq/carryon-app">GitHub</a>
<a class="btn btn-s" href="/download"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9.5M6 9l4 4 4-4M4 16.5h12"/></svg><span data-i="dlShort"></span></a>
</div></header>
<main>
<div class="wrap hero">

c5:"일하는 중인 세션에는 ‘백업하고 메모리 정리’ 버튼이 없어서 하던 일이 끊기지 않아요. ‘끝나면 정리’를 예약해 두면 일이 멈춘 뒤 정리하고 알려 줘요. 알림을 누르면 그 세션이 바로 떠요.",c6:"CarryOn은 실행 중인 세션을 끄거나 새 창으로 다시 열지 않아요. Orca 칸에서 실행 중인 Claude Code·Codex에는 ‘백업하고 새 세션으로’를 누를 때만, 그 세션이 쉬고 있고 입력줄이 비어 있을 때만 /clear(Codex는 /new)와 이어 가기 글을 넣어요. 설정에서 ‘메모리 차면 자동 정리’를 켜 두면 Claude Code와 Codex가 빨간 선에 닿을 때 그 자리에서 스스로 메모리를 정리해요. CarryOn은 두 도구의 설정에 그 값 하나만 써 두고, 끄면 원래대로 되돌려요.",
sub:"Claude Code, Codex, Aside, Gemini CLI 세션이 저마다 얼마나 찼는지 보여 줘요. 거의 다 찬 세션은 버튼 하나로 백업하고 메모리를 정리해서, 하던 일을 그 자리에서 이어 갈 수 있어요.",

pMore:"정확히 무엇을 읽나요",pDetail:"~/.claude, ~/.codex, ~/.aside, ~/.gemini의 세션 기록(Claude Code, Codex, Aside, Gemini CLI)을 한 줄씩 읽어 메타데이터(세션 ID, 이름, 제목, 작업 폴더, 토큰 수, 시각, 누가 누구에게 일을 넘겼는지)를 뽑아요. 제목은 첫 메시지의 앞 60자 정도일 수 있어요. 각 세션의 마지막 요청(한 줄)과, 맨 위에 보이는 세션의 최근 요청 3개·마지막 답의 끝·계획은 그 세션 기록에서 읽어 이 Mac에서만(앱이나, ‘터미널에서 열기’로 연 그 터미널에서) 보여 주고, 저장하거나 어디로 보내지 않아요. 그 밖에 할 일 메모, 프로세스 목록(어떤 세션이 어느 앱에서 실행 중인지), 그리고 ‘백업하고 메모리 정리’를 위해 로그인 셸의 PATH를 한 번 읽고, Orca 칸에서 ‘백업하고 새 세션으로’를 누르면 Orca 자체 명령으로 그 칸의 화면을 읽어요.",

cup:"「セッションの整理」は、ターミナルで開いたまましばらく使っていない Claude Code のセッションとそれぞれのメモリ、そして直近 24 時間でトークンをいちばん多く読んだセッションを表示します。整理するものがあるときだけ「すべてのセッションを表示」の下に出ます。",

pNote:"「バックアップして圧縮」（または「バックアップして新しいセッションへ」）を押したときだけ、そのセッション一つのログを読みやすい .md と一緒に ~/.carryon/backups/ にコピーし、そのツール自身の /compact（claude または codex）を実行します。セッションで /compact と入力したときと同じく、圧縮がそのセッションのログに追加され、会話は要約のためにモデルの提供元に送られます。",
c5:"作業中のセッションには「バックアップして圧縮」ボタンが出ないので、作業が途中で切れません。「終わったら整理」を予約すると、作業が止まってから整理して通知します。通知をクリックするとそのセッションが表示されます。",c6:"CarryOn は実行中のセッションを終了したり、新しいウィンドウで開き直したりしません。Orca のペインで実行中の Claude Code・Codex には、「バックアップして新しいセッションへ」を押したときだけ、待機中で入力欄が空のときだけ、/clear（Codex は /new）と続きの指示を入力します。設定で「いっぱいになったら自動で整理」をオンにすると、Claude Code と Codex が赤い線でその場で自分で圧縮します。CarryOn は両ツールの設定にその値を一つ書くだけで、オフにすると元に戻します。",

f2h:"すべてのセッションを検索",f2p:"名前やプロジェクトでどのセッションでも探せます。行を右クリックすると、圧縮、再開コマンドのコピー、名前の変更ができます。変更した名前は CarryOn の中だけに保存されます。",sPrompt:"名前やプロジェクトで検索",sAll:"すべてのセッションを表示…",
f3h:"85% で通知",f3p:"セッションがいっぱいに近づくと通知が 1 回届くので、間に合ううちに圧縮できます。",nText:"決済 API 改修 の会話量 92% — 圧縮してください（バックアップして圧縮）",
mH:"メニューバーから",mP:"メニューバーの CarryOn をクリックするとウィンドウが開きます。右クリックすると、いちばん埋まったセッション 3 つがリングと % 付きで出て（選ぶとそのセッションを表示）、設定と「アップデートを確認」もあります。こちらはブラウザでリリースページを開きます。",mOpen:"CarryOn を開く",mTop:"会話量の多いセッション",mSet:"設定…",mUpd:"アップデートを確認…",
bH:"会話をひと目で",bP:"選んだセッションの最後の依頼を押すと、その前の依頼と最後の返答が開きます。「ターミナルで開く」も、セッションを再開する前に最近のやりとりを表示します。",bK1:"最後の依頼",bK2:"最近の依頼",bK3:"最後の返答",
f4h:"10 の言語",f4p:"英語・韓国語・日本語・中国語（簡体字）・ドイツ語・フランス語・スペイン語・イタリア語・オランダ語・ポルトガル語に対応。最初の起動で選べて、いつでも変えられます。",
ih:"はじめて起動するとき",iIntro:"CarryOn はまだ Apple の公証を受けていないため、最初の 1 回だけ macOS が確認します。",
s1:"<b>.dmg</b> を開き、<b>CarryOn</b> を <b>アプリケーション</b> にドラッグします。",
s2:"アプリを開くと、macOS が確認できないと表示します。今は想定どおりなので <b>完了</b> を押してください。",
s3:"<b>システム設定 → プライバシーとセキュリティ</b> で下にスクロールし、<b>このまま開く</b> を押して確認します。",
alt:"ターミナル派なら、この 1 行でダウンロード、SHA-256 の確認、インストールまで済みます（実行中の CarryOn は終了して置き換えます）。「このまま開く」の手順もいりません。",term:"ターミナル",copy:"コピー",copied:"コピーしました",copyFailed:"コマンドを選択して手動でコピーしてください。",
m14:"macOS 14 Sonoma では、アプリを右クリックして「開く」を選んでも起動できます。",bar:"Dock アイコンはありません。アプリはメニューバーにいます。",
ph:"記録はこの Mac の中だけで読みます",p0:"CarryOn は Mac にすでにあるセッション記録を読み、見つけた内容をこの Mac の中だけで表示します。",
p1:"CarryOn 自体はネットワークに接続しません。",p2:"メッセージ本文は全文を表示せず、保存も送信もしません。",
pMore:"何を読み取るのか、くわしく",pDetail:"~/.claude、~/.codex、~/.aside、~/.gemini のセッション記録（Claude Code、Codex、Aside、Gemini CLI）を 1 行ずつ読み、メタデータ（セッション ID、名前、タイトル、作業フォルダ、トークン数、時刻、誰が誰に仕事を渡したか）を取り出します。タイトルは最初のメッセージの先頭約 60 文字になることがあります。各セッションの最後の依頼（1 行）と、いちばん上に表示中のセッションの最近の依頼 3 件・最後の返答の末尾・計画は、そのログから読んでこの Mac の中だけ（アプリか、「ターミナルで開く」で開いたそのターミナル）で表示し、保存も送信もしません。ほかに、やることメモ、プロセス一覧（どのセッションがどのアプリで実行中か）、そして「バックアップして圧縮」のためにログインシェルの PATH を一度だけ読み、Orca のペインで「バックアップして新しいセッションへ」を押したときは、Orca 自身のコマンドでそのペインの画面を読みます。",
foot:"たくさんの AI エージェントを同時に動かす人のために。"},
zh:{dlH:"下载 CarryOn",startH:"开始使用",startP:"安装到 Mac 上，首次打开时确认一次即可。",macH:"Mac 应用",moreH:"更新与帮助",moreP:"新版本和安装脚本都在 GitHub 上。",updH:"更新",updP:"右键点击菜单栏中的 CarryOn，选择“检查更新”即可打开发布页面。再次运行终端里的那一行命令，也会换成最新版本。",relRow:"版本说明",scriptRow:"安装脚本",repoRow:"仓库",view:"查看",chip:"Apple 芯片与 Intel",
langLabel:"语言",tocLabel:"目录",dlShort:"下载",dl:"下载 Mac 版",cleanAlt:"使用演示数据的“整理会话”界面：空闲的 Claude Code 会话及其占用的内存、关闭所选会话的按钮，下方是 24 小时内读取 token 最多的会话。",
cu4:"压缩时不会启动该会话的任何 MCP 服务器，Claude Code 和 Codex 都一样，所以占用的内存更少。",
cu3:"token 用量大的会话会显示 24 小时内读取的 token 数，可以在那一行直接整理（一次一个，其余排队）；正在工作的可以预约“完成后整理”。会话每次都会重新读取整段对话，压缩后每次读取的量会减少。",
cu2:"只能关闭在终端里启动的 Claude Code 会话；它启动的命令仍在运行的会话不会被预先选中。",
cu1:"空闲会话只有在你确认后才会关闭。关闭前会逐个再检查一次，发送普通的退出信号（SIGTERM），绝不强制结束。对话会保留，随时可以在“所有会话”里接着打开。",
cup:"“整理会话”会列出在终端里一直开着、有一阵子没用的 Claude Code 会话及其各自占用的内存，以及最近 24 小时读取 token 最多的会话。只有需要整理时，它才会出现在“显示所有会话”下方。",
cuh:"整理空闲和吃资源的会话",
tC:"整理会话",
listAlt:"主屏幕列表：等你回复 1、需要整理 4（每行有压缩按钮）、运行中 5（演示数据）。",
pNote:"只有点击“备份并压缩”（或“备份并开新会话”）时，才会把那一个会话的日志连同一份易读的 .md 复制到 ~/.carryon/backups/，然后运行该工具自己的 /compact（claude 或 codex）。和在会话中输入 /compact 一样，压缩结果会追加到该会话的日志，对话会发送给你的模型提供商进行总结。",
c5:"正在工作的会话没有“备份并压缩”按钮，以免打断它的工作。预约“完成后整理”后，它停下时会自动整理并通知你。点击通知即可打开那个会话。",c6:"CarryOn 不会关闭正在运行的会话，也不会在新窗口中重新打开它。对在 Orca 窗格中运行的 Claude Code 或 Codex，只有在你点击“备份并开新会话”、且它空闲、输入栏为空时，才会向那里输入 /clear（Codex 为 /new）和继续说明。在设置中打开“满了自动整理”，Claude Code 和 Codex 会在到达红线时就地自行压缩会话。CarryOn 只在两个工具的设置里写入这一个值，关闭后恢复原样。",
sub:"CarryOn 显示每个 Claude Code、Codex、Aside 和 Gemini CLI 会话的上下文用了多少。快满时，一个按钮就能备份并压缩，从停下的地方接着做。",
meta:"版本 {v} · macOS 14 或更高版本 · Apple 芯片与 Intel · 免费",
heroAlt:"使用演示数据的 CarryOn 窗口：92%、快满的会话带着“备份并压缩”按钮和同组会话的圆环显示，还有等你回复、需要整理和正在运行的会话列表。",
t1:"一目了然",t2:"备份并压缩",t3:"待办备忘",t5:"更多",t6:"安装",t7:"隐私",
g1h:"需要你处理的会话，一目了然",g1p:"主屏幕以卡片列出等你回复的、需要整理的（60% 以上）和正在运行的会话，每个只出现一次。选中一个，它会带着圆环放大显示。如果它属于某个组，卡片里会用圆环显示这个组：分派工作的会话，以及直接从它那里接到工作的会话，组名就是分派工作的会话的名称。点组名会列出所有组，最满的在前并带百分比；点 +N 会在原处展开其余的圆环。窗口够宽时，列表和它并排显示。",

lg1:"60% 以下：还有余量，运行中为绿色",lg2:"60% 及以上：黄色，需要整理",lg3:"85% 及以上：橙色，快满了，会提醒",
c1h:"一个按钮，腾出空间",c1p:"“备份并压缩”先备份对话，再压缩它，让这个会话本身的百分比降下来。Mac 应用会在面板里直接运行，并显示每一步和用时。",
tidyAlt:"92%“对话快满了”的会话，下方是“备份并压缩”面板：依次列出每一步，最后显示从 92% 降到 18%（演示数据）。",
c2l:"刚压缩 · 92% → 18%",c2t:"压缩过的会话会在主屏幕上保留一小时，不会一降下来就消失。",
c3:"备份不到一秒。等待的是模型写摘要的时间，长对话大约 30 秒到 2 分钟。",c4:"Claude Code 和 Codex 会话就地压缩；Aside 和 Gemini CLI 会话则在新会话中继续。原来的会话会变成灰色，卡片里可以直接跳到接续它的会话。",
d1h:"待办也跟着走",d1p:"每个会话都可以记一份带编号的待办。打开“接续时一起发送”后，压缩后的第一条消息会附上没做完的项；在新会话中继续时，它们会放在最前面。",
todoAlt:"待办备忘：带编号的清单中已完成一项，“接续时一起发送”已打开（演示数据）。",


e2h:"用的哪个工具，在哪里运行",e2p:"每一行都会标出，比如“Claude Code · Warp”，会话结束后也会保留。没有自己名称的会话显示对话标题，而不是文件夹名。子代理不单独占一行，而是在它的会话上显示为“成员 2”。",
ch1:"Claude Code · Warp",ch2:"Codex · 应用",ch3:"Claude Code · VS Code",ch4:"Codex · CLI",
f0h:"还有这些",
f2h:"搜索所有会话",f2p:"按名称或项目找到任何会话。右键点击一行，即可压缩、复制恢复命令或重命名；新名称只保存在 CarryOn 里。",sPrompt:"按名称或项目查找",sAll:"显示所有会话…",
f3h:"到 85% 就提醒",f3p:"会话快满时会收到一次通知，来得及压缩。",nText:"支付 API 重构 对话量 92% — 请压缩（备份并压缩）",
mH:"从菜单栏",mP:"点击菜单栏中的 CarryOn 打开窗口。右键点击会列出最满的 3 个会话，带圆环和百分比（点一个即可显示它），还有设置和检查更新。检查更新会在浏览器中打开发布页面。",mOpen:"打开 CarryOn",mTop:"对话量最多的会话",mSet:"设置…",mUpd:"检查更新…",
bH:"对话一目了然",bP:"点击选中会话的最后一个请求，会展开之前的请求和最后的回复。“在终端中打开”也会在恢复会话之前先显示最近的对话。",bK1:"最后的请求",bK2:"最近的请求",bK3:"最后的回复",
f4h:"十种语言",f4p:"支持英语、韩语、日语、简体中文、德语、法语、西班牙语、意大利语、荷兰语和葡萄牙语。首次启动时选择，之后随时可以更改。",
ih:"首次启动",iIntro:"CarryOn 还没有经过 Apple 公证，所以首次打开时 macOS 会确认一次。",
s1:"打开 <b>.dmg</b>，把 <b>CarryOn</b> 拖到 <b>应用程序</b> 文件夹。",
s2:"打开应用。macOS 会提示无法验证，这是目前的正常现象，点击 <b>完成</b>。",
s3:"前往 <b>系统设置 → 隐私与安全性</b>，向下滚动，点击 <b>仍要打开</b>，然后确认。",
alt:"习惯用终端？这一行命令会下载、校验 SHA-256 并完成安装（会退出正在运行的 CarryOn 并替换为新版），无需点击“仍要打开”。",term:"终端",copy:"复制",copied:"已复制",copyFailed:"请选择命令并手动复制。",
m14:"在 macOS 14 Sonoma 上，也可以右键点击应用并选择“打开”。",bar:"没有 Dock 图标：应用位于菜单栏。",
ph:"记录只在你的 Mac 上读取",p0:"CarryOn 读取你 Mac 上已有的会话记录，找到的内容只在这台 Mac 上显示。",
p1:"CarryOn 本身不进行任何网络连接。",p2:"消息正文不会完整显示，也不会被保存或发送。",
pMore:"具体读取哪些内容",pDetail:"逐行读取 ~/.claude、~/.codex、~/.aside 和 ~/.gemini 中的会话记录（Claude Code、Codex、Aside、Gemini CLI），提取元数据：会话 ID、名称、标题、工作目录、token 数、时间以及谁把工作交给了谁。标题可能是第一条消息的前约 60 个字符。每个会话的最后一个请求（一行），以及最上方显示的会话的最近 3 个请求、最后回复的结尾和计划，都从该会话的日志读取，只在这台 Mac 上显示（在应用中，或在用“在终端中打开”打开的那个终端中），既不保存也不发送。此外还会读取你的待办、进程列表（哪些会话在运行、在哪个应用中），以及为“备份并压缩”读取一次登录 shell 的 PATH；在 Orca 窗格中点击“备份并开新会话”时，还会通过 Orca 自己的命令读取该窗格的屏幕。",
foot:"为同时运行多个 AI 代理的人而做。"},
de:{dlH:"CarryOn herunterladen",startH:"Loslegen",startP:"Installiere die App auf deinem Mac und öffne sie einmal.",macH:"Mac-App",moreH:"Updates und Hilfe",moreP:"Neue Versionen und das Installationsskript findest du auf GitHub.",updH:"Updates",updP:"Klicke mit der rechten Maustaste auf CarryOn in der Menüleiste und wähle „Nach Updates suchen“, um die Seite mit den Versionen zu öffnen. Wenn du die Terminal-Zeile erneut ausführst, wird ebenfalls die neueste Version installiert.",relRow:"Versionshinweise",scriptRow:"Installationsskript",repoRow:"Repository",view:"Ansehen",chip:"Apple Silicon & Intel",
langLabel:"Sprache",tocLabel:"Auf dieser Seite",dlShort:"Download",dl:"Download für Mac",cleanAlt:"„Sitzungen aufräumen“ mit Demodaten: ruhende Claude-Code-Sitzungen mit dem Speicher, den jede belegt, und eine Taste, die die ausgewählten schließt, darunter die Sitzungen, die in 24 Stunden die meisten Tokens gelesen haben.",
cu4:"Beim Komprimieren startet keiner der MCP-Server der Sitzung, bei Codex wie bei Claude Code. So braucht es weniger Speicher.",
cu3:"Bei Sitzungen mit vielen Tokens steht dabei, wie viele Tokens sie in 24 Stunden gelesen haben. Komprimiere eine direkt in ihrer Zeile (eine nach der anderen, die übrigen warten), oder wähle „Aufräumen, wenn fertig“, wenn sie gerade arbeitet. Jede Runde liest das ganze Gespräch neu, also macht Komprimieren jede Runde leichter.",
cu2:"Schließen lassen sich nur Claude-Code-Sitzungen, die in einem Terminal gestartet wurden. Eine, deren Befehl noch im Hintergrund läuft, wird nicht für dich ausgewählt.",
cu1:"Ruhende Sitzungen werden erst geschlossen, wenn du bestätigst. Direkt davor wird jede noch einmal geprüft und bekommt dann ein normales Beenden-Signal (SIGTERM), nie ein erzwungenes. Das Gespräch bleibt: Du kannst es jederzeit unter „Alle Sitzungen“ fortsetzen.",
cup:"„Sitzungen aufräumen“ zeigt die Claude-Code-Sitzungen, die in einem Terminal offen sind und eine Weile nicht benutzt wurden, mit dem Speicher, den jede belegt, und die Sitzungen, die in den letzten 24 Stunden die meisten Tokens gelesen haben. Die Zeile dafür erscheint unter „Alle Sitzungen …“ nur, wenn es etwas zu tun gibt.",
cuh:"Ruhende und schwere Sitzungen aufräumen",
tC:"Sitzungen aufräumen",
listAlt:"Die Listen der Startseite: Wartet auf dich 1, Komprimieren nötig 4 mit je einer Taste „Komprimieren“, und Läuft 5 (Demodaten).",
pNote:"Nur wenn du „Sichern & komprimieren“ (oder „Sichern & neu beginnen“) drückst, kopiert CarryOn das Protokoll dieser einen Sitzung samt lesbarer .md nach ~/.carryon/backups/ und führt dann das /compact des jeweiligen Tools aus (claude oder codex). Wie wenn du /compact in der Sitzung eintippst, wird die Komprimierung dem Protokoll der Sitzung hinzugefügt, und das Gespräch geht zum Zusammenfassen an deinen Modellanbieter.",
c5:"Eine Sitzung, die gerade arbeitet, hat keine Taste „Sichern & komprimieren“, damit ihre Arbeit nie abgebrochen wird. „Aufräumen, wenn fertig“ merkt sie zum Komprimieren vor, sobald sie aufhört, mit einer Mitteilung; ein Klick auf die Mitteilung zeigt diese Sitzung.",c6:"CarryOn beendet nie eine laufende Sitzung und öffnet sie nie in einem neuen Fenster neu. In einem Orca-Bereich tippt „Sichern & neu beginnen“ /clear (Codex: /new) und dann die Weiter-Nachricht in eine laufende Claude-Code- oder Codex-Sitzung, nur wenn du es drückst und nur, solange sie ruht und ihre Eingabezeile leer ist. Schalte in den Einstellungen „Automatisch aufräumen, wenn voll“ ein, dann komprimieren Claude Code und Codex eine Sitzung an der roten Linie selbst, genau dort, wo sie läuft. CarryOn schreibt dafür nur diesen einen Wert in ihre Einstellungen und stellt beim Ausschalten den alten Stand wieder her.",
sub:"CarryOn zeigt, wie voll jede Sitzung in Claude Code, Codex, Aside und Gemini CLI ist. Ist eine fast voll, sichert und komprimiert eine Taste sie, und du arbeitest dort weiter, wo du aufgehört hast.",
meta:"Version {v} · macOS 14 oder neuer · Apple Silicon & Intel · Kostenlos",
heroAlt:"Das CarryOn-Fenster mit Demodaten: eine Sitzung bei 92 %, fast voll, mit ihrer Taste „Sichern & komprimieren“ und den Ringen ihrer Gruppe, dazu die Listen der Sitzungen, die auf dich warten, komprimiert werden müssen und laufen.",
t1:"Auf einen Blick",t2:"Sichern & komprimieren",t3:"To-dos",t5:"Mehr",t6:"Installieren",t7:"Datenschutz",
g1h:"Sehen, was dich braucht",g1p:"Die Startseite zeigt auf Karten die Sitzungen, die auf deine Antwort warten, die, die komprimiert werden müssen (60 % oder mehr), und die laufenden, jede nur einmal. Wähle eine, um sie groß mit ihrem Ring zu sehen. Gehört sie zu einer Gruppe, zeigt ihre Karte die Gruppe als Ringe: eine Sitzung, die Arbeit verteilt hat, und die Sitzungen, die sie bekommen haben, benannt nach der ersten. Der Name der Gruppe ist ein Menü aller Gruppen, die vollste zuerst mit ihrem Prozentwert, und +N zeigt die übrigen Ringe an Ort und Stelle. In einem breiten Fenster stehen die Listen und diese Sitzung nebeneinander.",
lg1:"Unter 60 %: noch Platz, grün, solange sie läuft",lg2:"Ab 60 %: gelb, Komprimieren nötig",lg3:"Ab 85 %: orange, fast voll, mit Mitteilung",
c1h:"Platz schaffen mit einer Taste",c1p:"„Sichern & komprimieren“ sichert das Gespräch und komprimiert es dann, sodass der Prozentwert der Sitzung selbst sinkt. Die Mac-App erledigt das für dich in einem Bereich und zeigt jeden Schritt und wie lange er gedauert hat.",
tidyAlt:"Die Sitzung bei 92 %, Fast voll, darunter der Bereich „Sichern & komprimieren“: jeder Schritt aufgelistet, am Ende 92 % → 18 % (Demodaten).",
c2l:"Gerade komprimiert · 92 % → 18 %",c2t:"Eine komprimierte Sitzung bleibt eine Stunde auf der Startseite, damit sie nicht in dem Moment verschwindet, in dem sie sinkt.",
c3:"Die Sicherung dauert unter einer Sekunde. Gewartet wird auf das Modell, das seine Zusammenfassung schreibt: 30 s bis 2 min bei einem langen Gespräch.",c4:"Claude-Code- und Codex-Sitzungen werden an Ort und Stelle komprimiert. Eine Aside- oder Gemini-CLI-Sitzung geht in einer neuen weiter; die alte wird grau, und ihre Karte verweist auf die neue.",
d1h:"Deine To-dos kommen mit",d1p:"Führe für jede Sitzung eine nummerierte To-do-Liste. Ist „Mitschicken“ an, folgen die offenen der ersten Nachricht nach einer Komprimierung oder gehen als Erstes in eine neue Sitzung.",
todoAlt:"Meine To-dos: eine nummerierte Liste mit einem erledigten Eintrag, und „Mitschicken“ ist eingeschaltet (Demodaten).",
e2h:"Welches Tool, und wo es läuft",e2p:"Jede Zeile sagt es, etwa Claude Code · Warp, auch nachdem die Sitzung beendet ist. Eine Sitzung ohne eigenen Namen heißt wie der Titel ihres Gesprächs, nicht wie ihr Ordner. Sub-Agents bekommen keine eigenen Zeilen: Bei ihrer Sitzung steht „2 Helfer“.",
ch1:"Claude Code · Warp",ch2:"Codex · App",ch3:"Claude Code · VS Code",ch4:"Codex · CLI",
f0h:"Außerdem in der App",
f2h:"Alle Sitzungen durchsuchen",f2p:"Finde jede Sitzung nach Name oder Projekt. Klicke mit der rechten Maustaste auf eine Zeile, um sie zu komprimieren, ihren Befehl zum Fortsetzen zu kopieren oder sie umzubenennen; der neue Name bleibt nur in CarryOn.",sPrompt:"Nach Name oder Projekt suchen",sAll:"Alle Sitzungen …",
f3h:"Ein Hinweis bei 85 %",f3p:"Du bekommst eine Mitteilung, wenn eine Sitzung fast voll ist, rechtzeitig zum Komprimieren.",nText:"Payments API v2 ist bei 92 %: jetzt komprimieren (Sichern & komprimieren)",
mH:"Aus der Menüleiste",mP:"Klicke in der Menüleiste auf CarryOn, um das Fenster zu öffnen. Ein Rechtsklick zeigt die drei vollsten Sitzungen mit Ring und Prozentwert (ein Klick zeigt sie an), die Einstellungen und „Nach Updates suchen“, das die Seite mit den Versionen in deinem Browser öffnet.",mOpen:"CarryOn öffnen",mTop:"Vollste Sitzungen",mSet:"Einstellungen …",mUpd:"Nach Updates suchen …",
bH:"Das Gespräch auf einen Blick",bP:"Klicke auf die letzte Anfrage der gewählten Sitzung, um die Anfragen davor und ihre letzte Antwort zu sehen. „Im Terminal öffnen“ zeigt die letzten Nachrichten ebenfalls, bevor die Sitzung weiterläuft.",bK1:"Letzte Anfrage",bK2:"Neueste Anfragen",bK3:"Letzte Antwort",
f4h:"In zehn Sprachen",f4p:"Englisch, Koreanisch, Japanisch, vereinfachtes Chinesisch, Deutsch, Französisch, Spanisch, Italienisch, Niederländisch und Portugiesisch. Wähle eine beim ersten Start und wechsle sie jederzeit.",
ih:"Erster Start",iIntro:"CarryOn ist noch nicht von Apple notarisiert, deshalb fragt macOS einmal nach, bevor es die App öffnet.",
s1:"Öffne die <b>.dmg</b> und ziehe <b>CarryOn</b> in <b>Programme</b>.",
s2:"Öffne die App. macOS meldet, dass es sie nicht überprüfen kann. Das ist vorerst normal: Klicke auf <b>Fertig</b>.",
s3:"Öffne <b>Systemeinstellungen → Datenschutz &amp; Sicherheit</b>, scrolle nach unten, klicke auf <b>Dennoch öffnen</b> und bestätige.",
alt:"Lieber im Terminal? Diese eine Zeile lädt die App, prüft ihre SHA-256 und installiert sie (ein laufendes CarryOn wird beendet und ersetzt), ohne den Schritt „Dennoch öffnen“:",term:"Terminal",copy:"Kopieren",copied:"Kopiert",copyFailed:"Markiere den Befehl und kopiere ihn von Hand.",
m14:"Unter macOS 14 Sonoma kannst du die App auch mit der rechten Maustaste anklicken und „Öffnen“ wählen.",bar:"Es gibt kein Dock-Symbol: CarryOn sitzt in der Menüleiste.",
ph:"Sitzungsprotokolle werden nur auf diesem Mac gelesen",p0:"CarryOn liest die Sitzungsprotokolle, die schon auf deinem Mac liegen, und zeigt, was es findet, nur auf diesem Mac.",
p1:"CarryOn selbst baut keine Netzwerkverbindungen auf.",p2:"Nachrichtentexte werden nie vollständig angezeigt, gespeichert oder irgendwohin gesendet.",
pMore:"Was genau gelesen wird",pDetail:"Die Sitzungsprotokolle in ~/.claude, ~/.codex, ~/.aside und ~/.gemini (Claude Code, Codex, Aside, Gemini CLI), Zeile für Zeile, nach Metadaten: Sitzungs-IDs, Namen, Titel, Arbeitsordner, Token-Zahlen, Zeiten und wer wem Arbeit übergeben hat. Ein Titel können die ersten rund 60 Zeichen der ersten Nachricht einer Sitzung sein. Die letzte Anfrage jeder Sitzung (eine Zeile) und, für die Sitzung ganz oben, ihre letzten 3 Anfragen, das Ende ihrer letzten Antwort und ihr Plan werden aus ihrem Protokoll gelesen und nur auf diesem Mac angezeigt, in der App oder, mit „Im Terminal öffnen“, in diesem Terminal: CarryOn speichert nichts davon und sendet es nirgendwohin. Außerdem liest es deine To-dos, die Prozessliste (welche Sitzungen laufen und in welcher App) und für „Sichern & komprimieren“ einmal den PATH deiner Login-Shell; für „Sichern & neu beginnen“ in einem Orca-Bereich den Bildschirm dieses Bereichs, über Orcas eigene CLI.",
foot:"Gemacht für alle, die viele KI-Agenten gleichzeitig laufen lassen."},
fr:{dlH:"Télécharger CarryOn",startH:"Pour commencer",startP:"Installez l’app sur votre Mac, puis ouvrez-la une fois.",macH:"App Mac",moreH:"Mises à jour et aide",moreP:"Les nouvelles versions et le script d’installation sont sur GitHub.",updH:"Mises à jour",updP:"Faites un clic droit sur CarryOn dans la barre des menus et choisissez Rechercher des mises à jour pour ouvrir la page des versions. Relancer la ligne du Terminal installe aussi la dernière version.",relRow:"Notes de version",scriptRow:"Script d’installation",repoRow:"Dépôt",view:"Voir",chip:"Apple silicon et Intel",
langLabel:"Langue",tocLabel:"Sur cette page",dlShort:"Télécharger",dl:"Télécharger pour Mac",cleanAlt:"Ranger les sessions avec des données de démo : les sessions Claude Code inactives, la mémoire que chacune occupe et un bouton pour fermer celles qui sont sélectionnées, puis les sessions qui ont lu le plus de tokens en 24 heures.",
cu4:"Le compactage ne démarre aucun des serveurs MCP de la session, pour Codex comme pour Claude Code : il demande donc moins de mémoire.",
cu3:"Les sessions gourmandes en tokens affichent les tokens lus en 24 heures. Compactez-en une directement dans sa ligne (une à la fois, les autres attendent leur tour), ou choisissez Ranger une fois fini si elle travaille. Chaque tour relit toute la conversation : compacter allège donc chaque tour.",
cu2:"Seules les sessions Claude Code lancées dans un terminal peuvent être fermées, et une session dont la commande tourne encore en arrière-plan n’est pas sélectionnée d’office.",
cu1:"Les sessions inactives ne sont fermées qu’après votre confirmation. Juste avant, chacune est vérifiée à nouveau, puis reçoit un signal d’arrêt normal (SIGTERM), jamais un arrêt forcé. La conversation reste : reprenez-la quand vous voulez depuis Toutes les sessions.",
cup:"Ranger les sessions liste les sessions Claude Code restées ouvertes dans un terminal et inutilisées depuis un moment, avec la mémoire que chacune occupe, ainsi que les sessions qui ont lu le plus de tokens ces dernières 24 heures. Sa ligne n’apparaît sous Toutes les sessions… que s’il y a quelque chose à faire.",
cuh:"Rangez les sessions inactives et lourdes",
tC:"Ranger les sessions",
listAlt:"Les listes de l’accueil : Vous attend 1, À compacter 4 avec un bouton Compacter sur chacune, et En cours 5 (données de démo).",
pNote:"C’est seulement quand vous appuyez sur Sauvegarder et compacter (ou Sauvegarder et repartir à neuf) que CarryOn copie le journal de cette session, avec un .md lisible, dans ~/.carryon/backups/, puis lance la commande /compact de l’outil (claude ou codex). Comme quand vous tapez /compact dans la session, le compactage est ajouté au journal de la session et la conversation est envoyée à votre fournisseur de modèle pour être résumée.",
c5:"Une session au travail n’a pas de bouton Sauvegarder et compacter, pour que son travail ne soit jamais interrompu. Ranger une fois fini la programme pour être compactée dès qu’elle s’arrête, avec une notification ; cliquez sur la notification pour afficher cette session.",c6:"CarryOn ne ferme jamais une session en cours et ne la rouvre jamais dans une nouvelle fenêtre. Dans un volet Orca, Sauvegarder et repartir à neuf tape /clear (Codex : /new) puis le message de reprise dans une session Claude Code ou Codex en cours, seulement quand vous appuyez dessus et seulement si elle est inactive, sa ligne de saisie vide. Activez Ranger automatiquement si plein dans les Réglages : Claude Code et Codex compactent alors eux-mêmes une session à la ligne rouge, là où elle tourne. CarryOn n’écrit que cette valeur dans leurs réglages et remet ce qui y était quand vous le désactivez.",
sub:"CarryOn montre à quel point chaque session Claude Code, Codex, Aside et Gemini CLI est remplie. Quand l’une d’elles est presque pleine, un seul bouton la sauvegarde et la compacte, et vous reprenez là où vous en étiez.",
meta:"Version {v} · macOS 14 ou ultérieur · Apple silicon et Intel · Gratuit",
heroAlt:"La fenêtre CarryOn avec des données de démo : une session à 92 %, presque pleine, avec son bouton Sauvegarder et compacter et les anneaux de son groupe, et les listes des sessions qui vous attendent, à compacter et en cours.",
t1:"D’un coup d’œil",t2:"Sauvegarder et compacter",t3:"À faire",t5:"Plus",t6:"Installation",t7:"Confidentialité",
g1h:"Voyez ce qui vous attend",g1p:"L’accueil liste sur des cartes, une seule fois chacune, les sessions qui attendent votre réponse, celles à compacter (60 % ou plus) et celles en cours. Choisissez-en une pour la voir en grand avec son anneau. Si elle fait partie d’un groupe, sa carte montre le groupe en anneaux : une session qui a confié du travail et les sessions qui l’ont reçu, le groupe portant le nom de la première. Le nom du groupe ouvre un menu de tous les groupes, le plus plein d’abord avec son %, et +N affiche les autres anneaux sur place. Dans une fenêtre large, les listes et cette session sont côte à côte.",
lg1:"Moins de 60 % : de la marge, vert pendant qu’elle tourne",lg2:"À partir de 60 % : jaune, à compacter",lg3:"À partir de 85 % : orange, presque pleine, avec une notification",
c1h:"Faites de la place d’un seul bouton",c1p:"Sauvegarder et compacter enregistre la conversation, puis la compacte pour que le % de la session elle-même baisse. L’app Mac s’en charge pour vous dans un panneau et montre chaque étape et sa durée.",
tidyAlt:"La session à 92 %, Presque pleine, et en dessous le panneau Sauvegarder et compacter : chaque étape listée, jusqu’à 92 % → 18 % (données de démo).",
c2l:"Compacté à l’instant · 92 % → 18 %",c2t:"Une session compactée reste une heure sur l’écran d’accueil, pour ne pas disparaître dès qu’elle baisse.",
c3:"La sauvegarde prend moins d’une seconde. L’attente, c’est le modèle qui rédige son résumé : de 30 s à 2 min pour une longue conversation.",c4:"Les sessions Claude Code et Codex sont compactées sur place. Une session Aside ou Gemini CLI continue dans une nouvelle ; l’ancienne devient grise et sa carte renvoie à la nouvelle.",
d1h:"Votre liste À faire vous suit",d1p:"Tenez une liste numérotée de choses à faire pour chaque session. Avec Joindre activé, celles qui restent ouvertes suivent le premier message après un compactage, ou passent en premier dans une nouvelle session.",
todoAlt:"Ma liste À faire : une liste numérotée avec un élément fait, et Joindre activé (données de démo).",
e2h:"Quel outil, et où il tourne",e2p:"Chaque ligne l’indique, comme Claude Code · Warp, même une fois la session terminée. Une session sans nom à elle prend le titre de sa conversation, pas celui de son dossier. Les sous-agents n’ont pas de ligne à eux : leur session indique « 2 assistants ».",
ch1:"Claude Code · Warp",ch2:"Codex · app",ch3:"Claude Code · VS Code",ch4:"Codex · CLI",
f0h:"Aussi dans l’app",
f2h:"Cherchez dans toutes les sessions",f2p:"Trouvez n’importe quelle session par nom ou par projet. Faites un clic droit sur une ligne pour la compacter, copier sa commande de reprise ou la renommer ; le nouveau nom reste dans CarryOn uniquement.",sPrompt:"Chercher par nom ou projet",sAll:"Toutes les sessions…",
f3h:"Une alerte à 85 %",f3p:"Vous recevez une seule notification quand une session est presque pleine, à temps pour la compacter.",nText:"Payments API v2 est à 92 % : compactez-la (Sauvegarder et compacter)",
mH:"Depuis la barre des menus",mP:"Cliquez sur CarryOn dans la barre des menus pour ouvrir sa fenêtre. Un clic droit montre les trois sessions les plus pleines, chacune avec son anneau et son % (cliquez pour l’afficher), les Réglages, et Rechercher des mises à jour, qui ouvre la page des versions dans votre navigateur.",mOpen:"Ouvrir CarryOn",mTop:"Sessions les plus pleines",mSet:"Réglages…",mUpd:"Rechercher des mises à jour…",
bH:"La conversation d’un coup d’œil",bP:"Cliquez sur la dernière demande de la session choisie pour voir les demandes précédentes et sa dernière réponse. Ouvrir dans Terminal montre aussi les derniers messages, avant que la session reprenne.",bK1:"Dernière demande",bK2:"Demandes récentes",bK3:"Dernière réponse",
f4h:"En dix langues",f4p:"Anglais, coréen, japonais, chinois simplifié, allemand, français, espagnol, italien, néerlandais et portugais. Choisissez au premier lancement, et changez quand vous voulez.",
ih:"Premier lancement",iIntro:"CarryOn n’est pas encore notarié par Apple, donc macOS vous demande une fois avant de l’ouvrir.",
s1:"Ouvrez le <b>.dmg</b> et glissez <b>CarryOn</b> dans <b>Applications</b>.",
s2:"Ouvrez l’app. macOS indique qu’il ne peut pas la vérifier. C’est normal pour l’instant : cliquez sur <b>Terminé</b>.",
s3:"Allez dans <b>Réglages Système → Confidentialité et sécurité</b>, faites défiler vers le bas, cliquez sur <b>Ouvrir quand même</b> et confirmez.",
alt:"Vous préférez Terminal ? Cette ligne télécharge l’app, vérifie son SHA-256 et l’installe (un CarryOn ouvert est quitté et remplacé), sans l’étape Ouvrir quand même :",term:"Terminal",copy:"Copier",copied:"Copié",copyFailed:"Sélectionnez la commande et copiez-la à la main.",
m14:"Sous macOS 14 Sonoma, vous pouvez aussi faire un clic droit sur l’app et choisir Ouvrir.",bar:"Pas d’icône dans le Dock : CarryOn vit dans la barre des menus.",
ph:"Les journaux de session sont lus sur ce Mac uniquement",p0:"CarryOn lit les journaux de session déjà présents sur votre Mac et n’affiche ce qu’il trouve que sur ce Mac.",
p1:"CarryOn lui-même n’établit aucune connexion réseau.",p2:"Le texte des messages n’est jamais affiché en entier, enregistré ni envoyé nulle part.",
pMore:"Ce qu’il lit exactement",pDetail:"Les journaux de session dans ~/.claude, ~/.codex, ~/.aside et ~/.gemini (Claude Code, Codex, Aside, Gemini CLI), ligne par ligne, pour en tirer des métadonnées : identifiants de session, noms, titres, dossier de travail, nombres de tokens, heures et qui a confié du travail à qui. Un titre peut être les quelque 60 premiers caractères du premier message d’une session. La dernière demande de chaque session (une ligne) et, pour la session en haut, ses 3 dernières demandes, la fin de sa dernière réponse et son plan sont lus dans son journal et affichés sur ce Mac uniquement, dans l’app ou, avec Ouvrir dans Terminal, dans ce terminal : CarryOn n’en garde rien et ne l’envoie nulle part. Il lit aussi vos choses à faire, la liste des processus (quelles sessions tournent, et dans quelle app) et, pour Sauvegarder et compacter, une fois le PATH de votre shell de connexion ; pour Sauvegarder et repartir à neuf dans un volet Orca, l’écran de ce volet, par la CLI d’Orca.",
foot:"Fait pour ceux qui font tourner beaucoup d’agents d’IA à la fois."},
es:{dlH:"Descargar CarryOn",startH:"Primeros pasos",startP:"Instálala en tu Mac y ábrela una vez.",macH:"App para Mac",moreH:"Actualizaciones y ayuda",moreP:"Las nuevas versiones y el script de instalación están en GitHub.",updH:"Actualizaciones",updP:"Haz clic derecho en CarryOn en la barra de menús y elige Buscar actualizaciones para abrir la página de versiones. Ejecutar de nuevo la línea de Terminal también instala la versión más reciente.",relRow:"Notas de la versión",scriptRow:"Script de instalación",repoRow:"Repositorio",view:"Ver",chip:"Apple silicon e Intel",
langLabel:"Idioma",tocLabel:"En esta página",dlShort:"Descargar",dl:"Descargar para Mac",cleanAlt:"Ordenar sesiones con datos de demostración: sesiones inactivas de Claude Code con la memoria que ocupa cada una y un botón para cerrar las seleccionadas, y debajo las sesiones que más tokens leyeron en 24 horas.",
cu4:"Al compactar no se inicia ninguno de los servidores MCP de la sesión, ni en Codex ni en Claude Code, así que hace falta menos memoria.",
cu3:"Las sesiones que gastan muchos tokens muestran los tokens que leyeron en 24 horas. Compacta una desde su propia fila (de una en una, las demás esperan su turno), o elige Ordenar al terminar si está trabajando. Cada turno vuelve a leer toda la conversación, así que compactar aligera cada turno.",
cu2:"Solo se pueden cerrar las sesiones de Claude Code iniciadas en un terminal, y una cuyo comando sigue en segundo plano no se selecciona por ti.",
cu1:"Las sesiones inactivas solo se cierran después de que confirmes. Justo antes se revisa cada una otra vez y recibe una señal de salida normal (SIGTERM), nunca una forzada. La conversación se queda: retómala cuando quieras desde Todas las sesiones.",
cup:"Ordenar sesiones muestra las sesiones de Claude Code que quedaron abiertas en un terminal y sin usar un rato, con la memoria que ocupa cada una, y las sesiones que más tokens leyeron en las últimas 24 horas. Su línea aparece bajo Todas las sesiones… solo cuando hay algo que hacer.",
cuh:"Ordena las sesiones inactivas y pesadas",
tC:"Ordenar sesiones",
listAlt:"Las listas de inicio: Te espera 1, Por compactar 4 con un botón Compactar en cada una, y En ejecución 5 (datos de demostración).",
pNote:"Solo cuando pulsas Copiar y compactar (o Copiar y empezar de cero), CarryOn copia el registro de esa sesión, con un .md legible, en ~/.carryon/backups/, y después ejecuta el /compact de la propia herramienta (claude o codex). Igual que cuando escribes /compact en la sesión, la compactación se añade al registro de esa sesión y la conversación va a tu proveedor del modelo para resumirla.",
c5:"Una sesión que está trabajando no tiene botón Copiar y compactar, para que su trabajo nunca se corte. Ordenar al terminar la deja lista para compactarse cuando pare, con una notificación; al hacer clic en la notificación aparece esa sesión.",c6:"CarryOn nunca cierra una sesión en ejecución ni la vuelve a abrir en una ventana nueva. En un panel de Orca, Copiar y empezar de cero escribe /clear (Codex: /new) y luego el mensaje para seguir en una sesión de Claude Code o Codex en ejecución, solo cuando lo pulsas y solo si está inactiva y con la línea de entrada vacía. Activa Ordenar solo al llenarse en Ajustes y Claude Code y Codex compactan la sesión por sí mismos al llegar a la línea roja, ahí mismo donde se ejecuta. CarryOn solo escribe ese valor en sus ajustes y deja lo que había al desactivarlo.",
sub:"CarryOn muestra cuánto se ha llenado cada sesión de Claude Code, Codex, Aside y Gemini CLI. Cuando una está casi llena, un solo botón la copia y la compacta, y sigues trabajando donde lo dejaste.",
meta:"Versión {v} · macOS 14 o posterior · Apple silicon e Intel · Gratis",
heroAlt:"La ventana de CarryOn con datos de demostración: una sesión al 92 %, casi llena, con su botón Copiar y compactar y los anillos de su grupo, y las listas de sesiones que te esperan, por compactar y en ejecución.",
t1:"De un vistazo",t2:"Copiar y compactar",t3:"Pendientes",t5:"Más",t6:"Instalar",t7:"Privacidad",
g1h:"Mira qué te necesita",g1p:"La pantalla de inicio muestra en tarjetas, una vez cada una, las sesiones que esperan tu respuesta, las que hay que compactar (60 % o más) y las que están en ejecución. Elige una para verla en grande con su anillo. Si forma parte de un grupo, su tarjeta muestra el grupo como anillos: una sesión que repartió trabajo y las sesiones que lo recibieron, con el nombre de la primera. El nombre del grupo es un menú con todos los grupos, el más lleno primero con su %, y +N muestra el resto de los anillos ahí mismo. En una ventana ancha, las listas y esa sesión quedan lado a lado.",
lg1:"Menos del 60 %: hay espacio, verde mientras se ejecuta",lg2:"Desde el 60 %: amarillo, por compactar",lg3:"Desde el 85 %: naranja, casi llena, con notificación",
c1h:"Haz espacio con un botón",c1p:"Copiar y compactar guarda la conversación y luego la compacta, para que baje el % de la propia sesión. La app para Mac lo hace por ti en un panel y muestra cada paso y cuánto tardó.",
tidyAlt:"La sesión al 92 %, Casi llena, y debajo el panel Copiar y compactar: cada paso en una lista, que termina en 92 % → 18 % (datos de demostración).",
c2l:"Recién compactado · 92 % → 18 %",c2t:"Una sesión compactada se queda una hora en la pantalla de inicio, para que no desaparezca en cuanto baja.",
c3:"La copia tarda menos de un segundo. La espera es el modelo escribiendo su resumen: de 30 s a 2 min en una conversación larga.",c4:"Las sesiones de Claude Code y Codex se compactan en el sitio. Una sesión de Aside o Gemini CLI sigue en una nueva; la anterior se vuelve gris y su tarjeta enlaza con la nueva.",
d1h:"Tus pendientes van contigo",d1p:"Lleva una lista numerada de pendientes para cada sesión. Con Enviar también activado, los abiertos acompañan al primer mensaje tras una compactación, o van primero en una sesión nueva.",
todoAlt:"Mis pendientes: una lista numerada con un elemento hecho y Enviar también activado (datos de demostración).",
e2h:"Qué herramienta, y dónde se ejecuta",e2p:"Cada fila lo dice, como Claude Code · Warp, incluso después de que la sesión termine. Una sesión sin nombre propio usa el título de su conversación, no el de su carpeta. Los subagentes no tienen filas propias: su sesión dice «2 ayudantes».",
ch1:"Claude Code · Warp",ch2:"Codex · app",ch3:"Claude Code · VS Code",ch4:"Codex · CLI",
f0h:"También en la app",
f2h:"Busca en todas las sesiones",f2p:"Encuentra cualquier sesión por nombre o proyecto. Haz clic derecho en una fila para compactarla, copiar su comando para retomarla o renombrarla; el nombre nuevo se guarda solo en CarryOn.",sPrompt:"Buscar por nombre o proyecto",sAll:"Todas las sesiones…",
f3h:"Un aviso al 85 %",f3p:"Recibes una sola notificación cuando una sesión está casi llena, a tiempo para compactarla.",nText:"Payments API v2 está al 92 %: compáctala (Copiar y compactar)",
mH:"Desde la barra de menús",mP:"Haz clic en CarryOn en la barra de menús para abrir su ventana. Con clic derecho ves las tres sesiones más llenas, cada una con su anillo y su % (haz clic en una para mostrarla), Ajustes, y Buscar actualizaciones, que abre la página de versiones en tu navegador.",mOpen:"Abrir CarryOn",mTop:"Sesiones más llenas",mSet:"Ajustes…",mUpd:"Buscar actualizaciones…",
bH:"La conversación de un vistazo",bP:"Haz clic en la última petición de la sesión elegida para ver las peticiones anteriores y su última respuesta. Abrir en Terminal también muestra los últimos mensajes antes de que la sesión continúe.",bK1:"Última petición",bK2:"Peticiones recientes",bK3:"Última respuesta",
f4h:"En diez idiomas",f4p:"Inglés, coreano, japonés, chino simplificado, alemán, francés, español, italiano, neerlandés y portugués. Elige uno la primera vez que la abras y cámbialo cuando quieras.",

ph:"Los registros de sesión se leen solo en este Mac",p0:"CarryOn lee los registros de sesión que ya están en tu Mac y muestra lo que encuentra solo en este Mac.",
p1:"CarryOn por sí misma no se conecta a la red.",p2:"El texto de los mensajes nunca se muestra completo, ni se guarda, ni se envía a ningún sitio.",
pMore:"Qué lee exactamente",pDetail:"Los registros de sesión de ~/.claude, ~/.codex, ~/.aside y ~/.gemini (Claude Code, Codex, Aside, Gemini CLI), línea por línea, para sacar metadatos: ID de sesión, nombres, títulos, carpeta de trabajo, número de tokens, horas y quién pasó trabajo a quién. Un título puede ser los primeros 60 caracteres, más o menos, del primer mensaje de una sesión. La última petición de cada sesión (una línea) y, para la sesión de arriba, sus 3 últimas peticiones, el final de su última respuesta y su plan se leen de su registro y se muestran solo en este Mac, en la app o, con Abrir en Terminal, en ese terminal: CarryOn no guarda nada de eso ni lo envía a ningún sitio. También lee tus pendientes, la lista de procesos (qué sesiones se ejecutan y en qué app) y, para Copiar y compactar, una vez el PATH de tu shell de inicio de sesión; para Copiar y empezar de cero en un panel de Orca, la pantalla de ese panel, con la propia CLI de Orca.",
foot:"Hecho para quien ejecuta muchos agentes de IA a la vez."},
it:{dlH:"Scarica CarryOn",startH:"Per iniziare",startP:"Installala sul tuo Mac e aprila una volta.",macH:"App per Mac",moreH:"Aggiornamenti e assistenza",moreP:"Nuove versioni e script di installazione sono su GitHub.",updH:"Aggiornamenti",updP:"Fai clic destro su CarryOn nella barra dei menu e scegli Verifica aggiornamenti per aprire la pagina delle versioni. Eseguire di nuovo la riga nel Terminale installa anche la versione più recente.",relRow:"Note di rilascio",scriptRow:"Script di installazione",repoRow:"Repository",view:"Vedi",chip:"Apple silicon e Intel",
langLabel:"Lingua",tocLabel:"In questa pagina",dlShort:"Scarica",dl:"Scarica per Mac",cleanAlt:"Riordina sessioni con dati dimostrativi: sessioni di Claude Code inattive con la memoria occupata da ciascuna e un pulsante per chiudere quelle selezionate, poi le sessioni che hanno letto più token in 24 ore.",
cu4:"Per compattare non si avvia nessuno dei server MCP della sessione, sia per Codex sia per Claude Code, quindi serve meno memoria.",
cu3:"Le sessioni che consumano molti token mostrano quanti token hanno letto in 24 ore. Compattane una direttamente nella sua riga (una alla volta, le altre aspettano il turno), oppure imposta Riordina a fine lavoro se sta lavorando. Ogni turno rilegge tutta la conversazione, quindi compattare alleggerisce ogni turno.",
cu2:"Si possono chiudere solo le sessioni di Claude Code avviate in un terminale, e una il cui comando è ancora attivo in background non viene selezionata per te.",
cu1:"Le sessioni inattive vengono chiuse solo dopo la tua conferma. Subito prima, ognuna viene ricontrollata e riceve un normale segnale di uscita (SIGTERM), mai uno forzato. La conversazione resta: riprendila quando vuoi da Tutte le sessioni.",
cup:"Riordina sessioni elenca le sessioni di Claude Code rimaste aperte in un terminale e inutilizzate da un po’, con la memoria occupata da ciascuna, e le sessioni che hanno letto più token nelle ultime 24 ore. La sua riga compare sotto Tutte le sessioni… solo quando c’è qualcosa da fare.",
cuh:"Riordina le sessioni inattive e pesanti",
tC:"Riordina sessioni",
listAlt:"Gli elenchi della schermata principale: Ti aspetta 1, Da compattare 4 con un pulsante Compatta su ciascuna, e In esecuzione 5 (dati dimostrativi).",
pNote:"Solo quando premi Salva e compatta (o Salva e ricomincia) CarryOn copia il log di quella sessione, con un .md leggibile, in ~/.carryon/backups/, e poi esegue il /compact dello strumento stesso (claude o codex). Come quando scrivi /compact nella sessione, la compattazione viene aggiunta al log della sessione e la conversazione va al fornitore del tuo modello per essere riassunta.",
c5:"Una sessione al lavoro non ha il pulsante Salva e compatta, così il suo lavoro non viene mai interrotto. Riordina a fine lavoro la imposta per essere compattata quando si ferma, con una notifica; un clic sulla notifica mostra quella sessione.",c6:"CarryOn non chiude mai una sessione in esecuzione né la riapre in una nuova finestra. In un riquadro Orca, Salva e ricomincia digita /clear (Codex: /new) e poi il messaggio per continuare in una sessione di Claude Code o Codex in esecuzione, solo quando lo premi e solo se è inattiva con la riga di input vuota. Attiva Riordina da solo quando è pieno in Impostazioni e Claude Code e Codex compattano da soli la sessione alla linea rossa, proprio dove gira. CarryOn scrive solo quel valore nelle loro impostazioni e rimette com’era quando lo disattivi.",
sub:"CarryOn mostra quanto è piena ogni sessione di Claude Code, Codex, Aside e Gemini CLI. Quando una è quasi piena, un solo pulsante la salva e la compatta, e continui da dove eri rimasto.",
meta:"Versione {v} · macOS 14 o successivo · Apple silicon e Intel · Gratis",
heroAlt:"La finestra di CarryOn con dati dimostrativi: una sessione al 92%, quasi piena, con il suo pulsante Salva e compatta e gli anelli del suo gruppo, e gli elenchi delle sessioni che ti aspettano, da compattare e in esecuzione.",
t1:"A colpo d’occhio",t2:"Salva e compatta",t3:"Da fare",t5:"Altro",t6:"Installa",t7:"Privacy",
g1h:"Guarda cosa ti aspetta",g1p:"La schermata principale elenca su schede, una volta ciascuna, le sessioni che aspettano la tua risposta, quelle da compattare (60% o più) e quelle in esecuzione. Scegline una per vederla in grande con il suo anello. Se fa parte di un gruppo, la sua scheda mostra il gruppo come anelli: una sessione che ha distribuito lavoro e le sessioni che lo hanno ricevuto, con il nome della prima. Il nome del gruppo è un menu di tutti i gruppi, il più pieno per primo con la sua %, e +N mostra gli altri anelli sul posto. In una finestra larga, gli elenchi e quella sessione stanno uno accanto all’altra.",
lg1:"Sotto il 60%: c’è spazio, verde mentre è in esecuzione",lg2:"Dal 60%: giallo, da compattare",lg3:"Dall’85%: arancione, quasi piena, con una notifica",
c1h:"Fai spazio con un pulsante",c1p:"Salva e compatta salva la conversazione, poi la compatta così che scenda la % della sessione stessa. L’app per Mac lo fa per te in un pannello e mostra ogni passaggio e quanto è durato.",
tidyAlt:"La sessione al 92%, Quasi piena, e sotto il pannello Salva e compatta: ogni passaggio in elenco, fino a 92% → 18% (dati dimostrativi).",
c2l:"Appena compattato · 92% → 18%",c2t:"Una sessione compattata resta un’ora nella schermata principale, così non sparisce appena scende.",
c3:"Il backup richiede meno di un secondo. L’attesa è il modello che scrive il riassunto: da 30 s a 2 min per una conversazione lunga.",c4:"Le sessioni di Claude Code e Codex vengono compattate sul posto. Una sessione di Aside o Gemini CLI continua in una nuova; quella lasciata diventa grigia e la sua scheda rimanda alla nuova.",
d1h:"Le tue cose da fare ti seguono",d1p:"Tieni un elenco numerato di cose da fare per ogni sessione. Con Invia insieme attivo, quelle aperte seguono il primo messaggio dopo una compattazione, oppure vanno per prime in una sessione nuova.",
todoAlt:"Le mie cose da fare: un elenco numerato con una voce completata, e Invia insieme attivo (dati dimostrativi).",
e2h:"Quale strumento, e dove gira",e2p:"Ogni riga lo dice, come Claude Code · Warp, anche dopo che la sessione è finita. Una sessione senza un nome suo prende il titolo della conversazione, non quello della cartella. I sub-agenti non hanno righe proprie: la loro sessione dice «2 aiutanti».",
ch1:"Claude Code · Warp",ch2:"Codex · app",ch3:"Claude Code · VS Code",ch4:"Codex · CLI",
f0h:"Anche nell’app",
f2h:"Cerca in tutte le sessioni",f2p:"Trova qualsiasi sessione per nome o progetto. Fai clic destro su una riga per compattarla, copiarne il comando per riprenderla o rinominarla; il nuovo nome resta solo in CarryOn.",sPrompt:"Cerca per nome o progetto",sAll:"Tutte le sessioni…",
f3h:"Un avviso all’85%",f3p:"Ricevi una sola notifica quando una sessione è quasi piena, in tempo per compattarla.",nText:"Payments API v2 è al 92%: compattala (Salva e compatta)",
mH:"Dalla barra dei menu",mP:"Fai clic su CarryOn nella barra dei menu per aprirne la finestra. Con il clic destro vedi le tre sessioni più piene, ognuna con il suo anello e la sua % (fai clic su una per mostrarla), Impostazioni, e Verifica aggiornamenti, che apre la pagina delle versioni nel browser.",mOpen:"Apri CarryOn",mTop:"Sessioni più piene",mSet:"Impostazioni…",mUpd:"Verifica aggiornamenti…",
bH:"La conversazione a colpo d’occhio",bP:"Fai clic sull’ultima richiesta della sessione scelta per vedere le richieste precedenti e la sua ultima risposta. Anche Apri nel Terminale mostra gli ultimi messaggi, prima che la sessione riprenda.",bK1:"Ultima richiesta",bK2:"Richieste recenti",bK3:"Ultima risposta",
f4h:"In dieci lingue",f4p:"Inglese, coreano, giapponese, cinese semplificato, tedesco, francese, spagnolo, italiano, olandese e portoghese. Scegline una al primo avvio e cambiala quando vuoi.",
ih:"Primo avvio",iIntro:"CarryOn non è ancora notarizzata da Apple, quindi macOS ti chiede conferma una volta prima di aprirla.",
s1:"Apri il <b>.dmg</b> e trascina <b>CarryOn</b> in <b>Applicazioni</b>.",
s2:"Apri l’app. macOS dice che non può verificarla. Per ora è normale: fai clic su <b>Fine</b>.",
s3:"Vai in <b>Impostazioni di Sistema → Privacy e sicurezza</b>, scorri in basso, fai clic su <b>Apri comunque</b> e conferma.",
alt:"Preferisci il Terminale? Questa riga la scarica, ne controlla lo SHA-256 e la installa (se CarryOn è aperta, viene chiusa e sostituita), senza il passaggio Apri comunque:",term:"Terminale",copy:"Copia",copied:"Copiato",copyFailed:"Seleziona il comando e copialo a mano.",
m14:"Su macOS 14 Sonoma puoi anche fare clic destro sull’app e scegliere Apri.",bar:"Non c’è un’icona nel Dock: CarryOn sta nella barra dei menu.",
ph:"I log delle sessioni vengono letti solo su questo Mac",p0:"CarryOn legge i log delle sessioni già presenti sul tuo Mac e mostra quello che trova solo su questo Mac.",
p1:"CarryOn di per sé non fa nessuna connessione di rete.",p2:"Il testo dei messaggi non viene mai mostrato per intero, salvato o inviato da nessuna parte.",
pMore:"Cosa legge esattamente",pDetail:"I log delle sessioni in ~/.claude, ~/.codex, ~/.aside e ~/.gemini (Claude Code, Codex, Aside, Gemini CLI), riga per riga, per ricavarne i metadati: ID di sessione, nomi, titoli, cartella di lavoro, numero di token, orari e chi ha passato lavoro a chi. Un titolo può essere i primi 60 caratteri circa del primo messaggio di una sessione. L’ultima richiesta di ogni sessione (una riga) e, per la sessione in cima, le sue ultime 3 richieste, la fine della sua ultima risposta e il suo piano vengono letti dal suo log e mostrati solo su questo Mac, nell’app o, con Apri nel Terminale, in quel terminale: CarryOn non ne salva nulla e non lo invia da nessuna parte. Legge anche le tue cose da fare, l’elenco dei processi (quali sessioni sono in esecuzione, e in quale app) e, per Salva e compatta, una volta il PATH della tua shell di login; per Salva e ricomincia in un riquadro Orca, lo schermo di quel riquadro, con la CLI di Orca.",
foot:"Fatto per chi usa molti agenti di IA insieme."},
nl:{dlH:"CarryOn downloaden",startH:"Aan de slag",startP:"Installeer de app op je Mac en open die één keer.",macH:"Mac-app",moreH:"Updates en hulp",moreP:"Nieuwe versies en het installatiescript staan op GitHub.",updH:"Updates",updP:"Klik met de rechtermuisknop op CarryOn in de menubalk en kies Zoek naar updates om de pagina met versies te openen. De Terminal-regel opnieuw uitvoeren installeert ook de nieuwste versie.",relRow:"Releasenotes",scriptRow:"Installatiescript",repoRow:"Repository",view:"Bekijken",chip:"Apple silicon en Intel",
langLabel:"Taal",tocLabel:"Op deze pagina",dlShort:"Download",dl:"Download voor Mac",cleanAlt:"Sessies opruimen met demogegevens: inactieve Claude Code-sessies met het geheugen dat elk inneemt en een knop om de geselecteerde te sluiten, daaronder de sessies die in 24 uur de meeste tokens lazen.",
cu4:"Bij het comprimeren start geen van de MCP-servers van de sessie, voor Codex net als voor Claude Code, dus het vraagt minder geheugen.",
cu3:"Sessies die veel tokens gebruiken, tonen hoeveel tokens ze in 24 uur lazen. Comprimeer er een direct in haar eigen rij (een tegelijk, de rest wacht op zijn beurt), of kies Opruimen als klaar als ze nog bezig is. Elke beurt leest het hele gesprek opnieuw, dus comprimeren maakt elke beurt lichter.",
cu2:"Alleen Claude Code-sessies die in een terminal zijn gestart, kunnen worden gesloten, en een sessie waarvan de opdracht nog op de achtergrond draait, wordt niet voor je geselecteerd.",
cu1:"Inactieve sessies worden pas gesloten nadat je bevestigt. Vlak daarvoor wordt elke sessie opnieuw gecontroleerd en krijgt ze een normaal stopsignaal (SIGTERM), nooit een geforceerd. Het gesprek blijft: ga er altijd mee verder vanuit Alle sessies.",
cup:"Sessies opruimen toont de Claude Code-sessies die in een terminal openstaan en een tijd niet gebruikt zijn, met het geheugen dat elk inneemt, en de sessies die de afgelopen 24 uur de meeste tokens lazen. De regel ervoor staat alleen onder Alle sessies… als er iets te doen is.",
cuh:"Ruim inactieve en zware sessies op",
tC:"Sessies opruimen",
listAlt:"De lijsten op het beginscherm: Wacht op jou 1, Moet comprimeren 4 met bij elk een knop Comprimeren, en Actief 5 (demogegevens).",
pNote:"Alleen als je op Back-up en comprimeren (of Back-up en opnieuw beginnen) drukt, kopieert CarryOn het logboek van die ene sessie, met een leesbare .md, naar ~/.carryon/backups/ en voert dan de eigen /compact van de tool uit (claude of codex). Net als wanneer je /compact in de sessie typt, wordt de compressie aan het logboek van die sessie toegevoegd en gaat het gesprek naar je modelaanbieder om samengevat te worden.",
c5:"Een sessie die bezig is, heeft geen knop Back-up en comprimeren, zodat haar werk nooit wordt afgebroken. Opruimen als klaar zet haar klaar om gecomprimeerd te worden zodra ze stopt, met een melding; klik op de melding en die sessie verschijnt.",c6:"CarryOn sluit nooit een actieve sessie en opent haar nooit opnieuw in een nieuw venster. In een Orca-paneel typt Back-up en opnieuw beginnen /clear (Codex: /new) en daarna het vervolgbericht in een actieve Claude Code- of Codex-sessie, alleen als je erop drukt en alleen als ze stil is met een lege invoerregel. Zet Automatisch opruimen als vol aan in Instellingen, dan comprimeren Claude Code en Codex een sessie zelf bij de rode lijn, precies waar ze draait. CarryOn schrijft alleen die ene waarde in hun instellingen en zet terug wat er stond als je het uitzet.",
sub:"CarryOn toont hoe vol elke sessie van Claude Code, Codex, Aside en Gemini CLI is. Is er een bijna vol, dan maakt één knop er een back-up van en comprimeert ze, en werk je verder waar je was.",
meta:"Versie {v} · macOS 14 of nieuwer · Apple silicon en Intel · Gratis",
heroAlt:"Het CarryOn-venster met demogegevens: een sessie op 92%, bijna vol, met haar knop Back-up en comprimeren en de ringen van haar groep, en de lijsten met sessies die op je wachten, die moeten comprimeren en die actief zijn.",
t1:"In één oogopslag",t2:"Back-up en comprimeren",t3:"Taken",t5:"Meer",t6:"Installeren",t7:"Privacy",
g1h:"Zie wat jou nodig heeft",g1p:"Het beginscherm toont op kaarten, elk één keer, de sessies die op je antwoord wachten, de sessies die moeten comprimeren (60% of meer) en de actieve. Kies er een om haar groot te zien met haar ring. Hoort ze bij een groep, dan toont haar kaart de groep als ringen: een sessie die werk uitdeelde en de sessies die dat werk kregen, genoemd naar de eerste. De naam van de groep is een menu van alle groepen, de volste eerst met haar %, en +N toont de overige ringen ter plekke. In een breed venster staan de lijsten en die sessie naast elkaar.",
lg1:"Onder 60%: ruimte genoeg, groen zolang ze actief is",lg2:"Vanaf 60%: geel, moet comprimeren",lg3:"Vanaf 85%: oranje, bijna vol, met een melding",
c1h:"Maak ruimte met één knop",c1p:"Back-up en comprimeren bewaart het gesprek en comprimeert het dan, zodat het % van de sessie zelf daalt. De Mac-app doet het voor je in een paneel en toont elke stap en hoe lang die duurde.",
tidyAlt:"De sessie op 92%, Bijna vol, en daaronder het paneel Back-up en comprimeren: elke stap op een rij, eindigend op 92% → 18% (demogegevens).",
c2l:"Net gecomprimeerd · 92% → 18%",c2t:"Een gecomprimeerde sessie blijft een uur op het beginscherm staan, zodat ze niet verdwijnt zodra ze daalt.",
c3:"De back-up duurt minder dan een seconde. Het wachten is op het model dat zijn samenvatting schrijft: 30 s tot 2 min bij een lang gesprek.",c4:"Claude Code- en Codex-sessies worden ter plekke gecomprimeerd. Een Aside- of Gemini CLI-sessie gaat verder in een nieuwe; de oude wordt grijs en haar kaart linkt naar de nieuwe.",
d1h:"Je taken gaan mee",d1p:"Houd voor elke sessie een genummerde takenlijst bij. Met Meesturen aan gaan de open taken mee met het eerste bericht na het comprimeren, of gaan ze als eerste een nieuwe sessie in.",
todoAlt:"Mijn taken: een genummerde lijst met één taak gedaan, en Meesturen staat aan (demogegevens).",
e2h:"Welke tool, en waar die draait",e2p:"Elke rij zegt het, zoals Claude Code · Warp, ook nadat de sessie is afgelopen. Een sessie zonder eigen naam heet naar de titel van haar gesprek, niet naar haar map. Subagents krijgen geen eigen rijen: bij hun sessie staat ‘2 helpers’.",
ch1:"Claude Code · Warp",ch2:"Codex · app",ch3:"Claude Code · VS Code",ch4:"Codex · CLI",
f0h:"Ook in de app",
f2h:"Zoek in alle sessies",f2p:"Vind elke sessie op naam of project. Klik met de rechtermuisknop op een rij om haar te comprimeren, haar opdracht om verder te gaan te kopiëren of haar naam te wijzigen; de nieuwe naam blijft alleen in CarryOn.",sPrompt:"Zoek op naam of project",sAll:"Alle sessies…",
f3h:"Een seintje bij 85%",f3p:"Je krijgt één melding als een sessie bijna vol is, op tijd om haar te comprimeren.",nText:"Payments API v2 staat op 92%: comprimeer haar (Back-up en comprimeren)",
mH:"Vanuit de menubalk",mP:"Klik op CarryOn in de menubalk om het venster te openen. Klik er met de rechtermuisknop op voor de drie volste sessies, elk met haar ring en % (klik er een aan om haar te tonen), Instellingen, en Zoek naar updates, dat de pagina met versies in je browser opent.",mOpen:"Open CarryOn",mTop:"Volste sessies",mSet:"Instellingen…",mUpd:"Zoek naar updates…",
bH:"Het gesprek in één oogopslag",bP:"Klik op het laatste verzoek van de gekozen sessie om de verzoeken ervoor en haar laatste antwoord te zien. Open in Terminal toont ook de laatste berichten, voordat de sessie verdergaat.",bK1:"Laatste verzoek",bK2:"Recente verzoeken",bK3:"Laatste antwoord",
f4h:"In tien talen",f4p:"Engels, Koreaans, Japans, vereenvoudigd Chinees, Duits, Frans, Spaans, Italiaans, Nederlands en Portugees. Kies er een bij de eerste start en wissel wanneer je wilt.",
ih:"Eerste start",iIntro:"CarryOn is nog niet door Apple genotariseerd, dus macOS vraagt het één keer voordat de app opent.",
s1:"Open de <b>.dmg</b> en sleep <b>CarryOn</b> naar <b>Apps</b>.",
s2:"Open de app. macOS zegt dat het de app niet kan verifiëren. Dat is voorlopig normaal: klik op <b>Gereed</b>.",
s3:"Ga naar <b>Systeeminstellingen → Privacy en beveiliging</b>, scrol omlaag, klik op <b>Open toch</b> en bevestig.",
alt:"Liever Terminal? Deze ene regel downloadt de app, controleert de SHA-256 en installeert haar (een geopende CarryOn wordt gestopt en vervangen), zonder de stap Open toch:",term:"Terminal",copy:"Kopieer",copied:"Gekopieerd",copyFailed:"Selecteer de opdracht en kopieer haar zelf.",
m14:"Op macOS 14 Sonoma kun je ook met de rechtermuisknop op de app klikken en Open kiezen.",bar:"Er is geen Dock-symbool: CarryOn woont in de menubalk.",
ph:"Sessielogboeken worden alleen op deze Mac gelezen",p0:"CarryOn leest de sessielogboeken die al op je Mac staan en toont wat het vindt alleen op deze Mac.",
p1:"CarryOn zelf maakt geen netwerkverbindingen.",p2:"Berichtteksten worden nooit volledig getoond, bewaard of ergens heen gestuurd.",
pMore:"Wat het precies leest",pDetail:"De sessielogboeken in ~/.claude, ~/.codex, ~/.aside en ~/.gemini (Claude Code, Codex, Aside, Gemini CLI), regel voor regel, voor metagegevens: sessie-ID’s, namen, titels, werkmap, aantallen tokens, tijden en wie werk aan wie gaf. Een titel kan bestaan uit de eerste zo’n 60 tekens van het eerste bericht van een sessie. Het laatste verzoek van elke sessie (één regel) en, voor de sessie bovenaan, haar laatste 3 verzoeken, het einde van haar laatste antwoord en haar plan worden uit haar logboek gelezen en alleen op deze Mac getoond, in de app of, met Open in Terminal, in die terminal: CarryOn bewaart er niets van en stuurt het nergens heen. Het leest ook je taken, de proceslijst (welke sessies draaien, en in welke app) en, voor Back-up en comprimeren, eenmaal het PATH van je login-shell; voor Back-up en opnieuw beginnen in een Orca-paneel het scherm van dat paneel, via Orca’s eigen CLI.",
foot:"Gemaakt voor wie veel AI-agents tegelijk laat draaien."},
pt:{lang:"pt-BR",dlH:"Baixar o CarryOn",startH:"Primeiros passos",startP:"Instale o app no seu Mac e abra uma vez.",macH:"App para Mac",moreH:"Atualizações e ajuda",moreP:"Novas versões e o script de instalação estão no GitHub.",updH:"Atualizações",updP:"Clique com o botão direito no CarryOn na barra de menus e escolha Verificar atualizações para abrir a página de versões. Rodar de novo a linha do Terminal também instala a versão mais recente.",relRow:"Notas da versão",scriptRow:"Script de instalação",repoRow:"Repositório",view:"Ver",chip:"Apple silicon e Intel",

cu4:"Ao compactar, nenhum dos servidores MCP da sessão é iniciado, no Codex e no Claude Code, então é preciso menos memória.",
cu3:"Sessões que gastam muitos tokens mostram os tokens lidos em 24 horas. Compacte uma direto na linha dela (uma de cada vez, as outras esperam a vez), ou escolha Arrumar ao terminar se ela estiver trabalhando. Cada turno lê a conversa inteira de novo, então compactar deixa cada turno mais leve.",

cu1:"Sessões ociosas só são fechadas depois que você confirma. Logo antes, cada uma é verificada de novo e recebe um sinal normal de saída (SIGTERM), nunca um forçado. A conversa fica: retome quando quiser em Todas as sessões.",
cup:"Arrumar sessões lista as sessões do Claude Code deixadas abertas em um terminal e sem uso há algum tempo, com a memória que cada uma ocupa, e as sessões que mais leram tokens nas últimas 24 horas. A linha dele só aparece em Todas as sessões… quando há algo a fazer.",
