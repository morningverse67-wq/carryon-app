<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CarryOn</title>
<meta name="description" content="See how full every AI agent session is, and back up and compact the full ones before they run out of room.">
<link rel="alternate" hreflang="en" href="https://carryon-app.pages.dev/?lang=en">
<link rel="alternate" hreflang="ko" href="https://carryon-app.pages.dev/?lang=ko">
<link rel="alternate" hreflang="ja" href="https://carryon-app.pages.dev/?lang=ja">
<link rel="alternate" hreflang="zh" href="https://carryon-app.pages.dev/?lang=zh">
<link rel="alternate" hreflang="x-default" href="https://carryon-app.pages.dev/">
<link rel="canonical" href="https://carryon-app.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://carryon-app.pages.dev/">
<meta property="og:title" content="CarryOn: every AI session at a glance">
<meta property="og:description" content="A free macOS menu-bar app that shows how full each Claude Code, Codex and Aside session is, and backs up and compacts the full ones before they run out of room.">
<meta property="og:image" content="https://carryon-app.pages.dev/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="img/favicon.png?v=otter">
<style>
:root{color-scheme:light dark;
--bg:#F7F7F5;--surface:#FFFFFF;--sunken:#F0F1F3;--line:#E2E3E7;--text:#111317;--muted:#3E4350;--faint:#585E6B;--accent:#1652C4;
--btn:#1A5BD0;--btn-hover:#1450BC;--toc-on:rgba(215,221,229,.7);--fill:#D3E2FF;--orange:#B23E0B;--ring-o:#EA6A1F;--ring-y:#E0A800;--green:#1C8C43;--neutral:#7A808C;--track:#E4E6EA;
--glow:rgba(26,91,208,.16);--shadow:0 1px 2px rgba(17,19,23,.05),0 28px 56px -28px rgba(17,19,23,.32);--bar-bg:rgba(247,247,245,.84);
--bar:60px;--tocbar:62px;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{
--bg:#0C0D10;--surface:#15171B;--sunken:#1B1D22;--line:#2A2D34;--text:#F2F3F5;--muted:#C3C7CF;--faint:#A2A8B3;--accent:#86AEFF;
--btn:#2563EB;--btn-hover:#1D4ED8;--toc-on:rgba(130,145,170,.2);--fill:#1C3A72;--orange:#FF9A52;--ring-o:#F97316;--ring-y:#FFCC00;--green:#3DD068;--neutral:#9AA0AB;--track:#2A2D34;
--glow:rgba(59,116,240,.24);--shadow:0 1px 2px rgba(0,0,0,.4),0 28px 56px -28px rgba(0,0,0,.8);--bar-bg:rgba(12,13,16,.82)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--bg);color:var(--text);font:400 18px/1.7 var(--sans);-webkit-font-smoothing:antialiased;overflow-wrap:break-word}
[lang|=ko]{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
[lang|=ja]{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic UI",Meiryo,sans-serif}
[lang|=zh]{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif}
:lang(ko){word-break:keep-all}
:lang(ja),:lang(zh){line-break:strict}
:lang(ja){word-break:auto-phrase}
:lang(zh) :is(h1,h2,h3){word-break:keep-all}
h1,h2,h3{text-wrap:balance}
p,li{text-wrap:pretty}
a{color:var(--accent)}
img{max-width:100%}
main{overflow-x:clip}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
::selection{background:var(--fill);color:var(--text)}
.wrap{width:min(1280px,100% - 64px);margin-inline:auto}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}

/* top bar */
.bar{position:sticky;top:0;z-index:20;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line)}
.bar-in{height:var(--bar);display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;color:inherit;text-decoration:none;font-weight:700;font-size:19px;letter-spacing:-.01em}
.brand img{border-radius:7px}
#lang{display:flex;gap:2px;padding:3px;background:var(--sunken);border-radius:10px}
#lang button{border:0;background:none;color:var(--muted);font:inherit;font-size:14px;font-weight:550;line-height:1.2;padding:6px 10px;border-radius:7px;cursor:pointer}
#lang button:hover{color:var(--text)}
#lang button[aria-pressed=true]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.14)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;background:var(--btn);color:#fff;text-decoration:none;font-weight:650;border-radius:12px;transition:background-color .15s}
.btn:hover{background:var(--btn-hover)}
.btn svg{width:19px;height:19px;flex:none}
.btn-s{font-size:15px;padding:8px 15px 8px 13px;border-radius:10px}
.btn-s svg{width:16px;height:16px}
.btn-l{font-size:18px;padding:16px 28px 16px 24px}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,480px) minmax(0,1fr);gap:56px;align-items:center;padding-block:72px 104px}
.eyebrow{margin:0 0 18px;font-size:15px;font-weight:650;color:var(--accent);letter-spacing:.01em}
h1{font-size:clamp(40px,4.1vw,58px);line-height:1.08;letter-spacing:-.035em;font-weight:760;margin:0 0 24px}
h1 span{display:block}
h1 .h1b{color:var(--faint)}
:is(:lang(ko),:lang(ja),:lang(zh)) h1{font-size:clamp(34px,3.6vw,50px);line-height:1.25;letter-spacing:-.02em}
.lede{font-size:clamp(18px,1.5vw,20px);color:var(--muted);margin:0 0 32px;max-width:32em}
.meta{margin:14px 0 0;font-size:15px;color:var(--faint)}
.also{margin:28px 0 0;padding-top:20px;border-top:1px solid var(--line);font-size:16px}
.also a,.foot a{color:var(--muted);text-decoration:none}
.also a:hover,.foot a:hover{color:var(--text);text-decoration:underline}
.hero-shot{position:relative;isolation:isolate}
.hero-shot::before{content:"";position:absolute;inset:-14% -10%;z-index:-1;background:radial-gradient(closest-side,var(--glow),transparent);pointer-events:none}
.hero-shot img{display:block;width:100%;height:auto;border-radius:14px;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:no-preference){.hero-shot img{animation:rise .7s cubic-bezier(.2,.7,.2,1) both}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

/* table of contents + sections */
.docs{display:grid;grid-template-columns:240px minmax(0,1fr);gap:56px;align-items:start}
.toc{position:sticky;top:calc(var(--bar) + 32px)}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.toc a{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 11px;border-radius:11px;color:var(--text);text-decoration:none;font-size:15px;font-weight:500;line-height:1.3}
.toc a:hover{background:var(--sunken);transition-duration:.15s}
.toc a[aria-current]{background:var(--toc-on)}
.toc svg{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
/* the fill: a blue copy of the icon and label over the item, shown from the left as far as the section has been read */
.toc .fill{position:absolute;inset:0;display:flex;align-items:center;gap:inherit;padding:inherit;border-radius:inherit;background:var(--btn);color:#fff;pointer-events:none;visibility:hidden;clip-path:inset(0 calc(100% - var(--p,0)*100%) 0 0)}
.toc .read .fill{visibility:visible}
@media (prefers-reduced-motion:no-preference){.toc a{transition:background-color .5s}.toc .fill{transition:clip-path .2s}}
/* tall enough that, reached from the table of contents, the next section starts below the middle of the window (the baseline) */
section{margin-bottom:120px;scroll-margin-top:calc(var(--bar) + 32px);min-height:calc(50vh - var(--bar) - 148px)}
section:last-child{margin-bottom:88px}
h2{font-size:clamp(28px,3vw,40px);line-height:1.18;letter-spacing:-.028em;font-weight:730;margin:0 0 14px}
:is(:lang(ko),:lang(ja),:lang(zh)) h2{line-height:1.32;letter-spacing:-.015em}
h3{font-size:20px;line-height:1.35;letter-spacing:-.01em;font-weight:680;margin:0 0 6px}
.intro{margin:0 0 36px;color:var(--muted);max-width:34em}
:is(:lang(ko),:lang(ja),:lang(zh)) .intro{max-width:36em}

/* screenshots: the hero's own window image, cropped (--x --y --w --h in its 1640 px) */
.shot{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--sunken);box-shadow:0 1px 2px rgba(17,19,23,.05),0 18px 40px -26px rgba(17,19,23,.35)}
.shot img{display:block;width:100%;height:auto}
.crop{position:relative;aspect-ratio:var(--w)/var(--h)}
.crop img{position:absolute;max-width:none;width:calc(1640/var(--w)*100%);left:calc(var(--x)/var(--w)*-100%);top:calc(var(--y)/var(--h)*-100%)}
.c-list{--x:16;--y:128;--w:790;--h:982;max-width:440px}
.dark-shot{max-width:440px;border-color:#2A2D34;background:#282828}
.crop-free{max-width:460px}

.duo{display:grid;grid-template-columns:minmax(0,460px) minmax(0,1fr);gap:24px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,440px);gap:48px;align-items:center}
.split .intro{margin-bottom:0}
.stack{display:grid;gap:24px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:24px}
.tile p{margin:0;color:var(--muted);font-size:17px;line-height:1.65}
.viz{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:14px;min-height:132px;margin-bottom:20px;padding:20px;border-radius:14px;background:var(--sunken)}
.bento{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}

/* rings, as the app draws them */
.ring{display:block;width:64px;height:64px}
.ring svg{display:block;width:100%;height:100%}
.ring .trk{fill:none;stroke:var(--track);stroke-width:4.5}
.ring .arc{fill:none;stroke:var(--neutral);stroke-width:4.5;stroke-linecap:round}
.ring text{font:700 13px var(--sans);fill:var(--text);letter-spacing:-.02em}
.ring tspan{font-size:8px}
.o .arc{stroke:var(--ring-o)}
.y .arc{stroke:var(--ring-y)}
.g .arc{stroke:var(--green)}
.legend{list-style:none;margin:28px 0 0;padding:0;display:grid;gap:14px}
.legend li{display:flex;align-items:center;gap:14px;font-size:17px;line-height:1.45;color:var(--muted)}
.legend li.o{color:var(--orange);font-weight:600}
.legend .ring{width:56px;height:56px;flex:none}
.ba-ring{width:84px;height:84px}
.viz>svg{width:26px;height:26px;fill:none;stroke:var(--faint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tile .ba-label{color:var(--text);font-weight:650;margin-bottom:6px}
.notes{list-style:none;margin:0;padding:0;display:grid;gap:14px}
.notes li{position:relative;padding-left:22px;color:var(--muted);font-size:17px;line-height:1.65}
.notes li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chips{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.chips li{padding:6px 13px;border-radius:999px;background:var(--sunken);border:1px solid var(--line);font-size:15px;font-weight:550;color:var(--text);white-space:nowrap}
.search{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--line);color:var(--faint);font-size:16px}
.search svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.allrow{display:flex;justify-content:space-between;width:100%;font-size:15px;color:var(--muted)}
kbd{font:inherit;color:var(--faint)}
.notif{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -14px rgba(0,0,0,.4);font-size:15px;line-height:1.45}
.notif img{border-radius:8px;flex:none}
.notif b{display:block;color:var(--text)}
.notif span{color:var(--muted)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px 16px;align-items:center;width:100%;font-size:14px;color:var(--faint)}
.kv i,.mrow i{display:block;height:8px;border-radius:4px;background:var(--line)}
.kv i.on{background:var(--faint)}
.menu{display:grid;gap:2px;width:100%;max-width:250px;padding:6px;border-radius:10px;background:var(--surface);border:1px solid var(--line);box-shadow:0 8px 24px -14px rgba(0,0,0,.4);font-size:14px;line-height:1.35;color:var(--text)}
.menu>span,.menu>b{padding:3px 8px}
.menu>b{font-size:12px;font-weight:600;color:var(--faint)}
.menu hr{width:calc(100% - 16px);margin:4px 8px;border:0;border-top:1px solid var(--line)}
.mrow{display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.mrow i{flex:1}
.mrow .ring{width:16px;height:16px;flex:none}
.mrow .ring circle{stroke-width:7}
.mrow .ring text{display:none}
.langs{display:grid;grid-template-columns:repeat(2,auto);gap:6px 28px;font-size:22px;font-weight:650;letter-spacing:-.01em}

/* install */
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:20px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px minmax(0,1fr);gap:14px;color:var(--muted)}
.steps li::before{content:counter(s);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--sunken);border:1px solid var(--line);color:var(--text);font-size:15px;font-weight:700;line-height:1;margin-top:-1px}
b{color:var(--text);font-weight:650}
.alt{margin:0 0 12px;color:var(--muted)}
.term{border-radius:14px;overflow:hidden;background:#15171B;color:#E8EAED;border:1px solid #2A2D34}
.term-top{display:flex;align-items:center;justify-content:space-between;padding:9px 10px 9px 16px;border-bottom:1px solid #2A2D34;font-size:14px;color:#A2A8B3}
.term button{border:1px solid #3A3F48;background:#22252C;color:#F2F3F5;font:inherit;font-size:14px;font-weight:600;padding:5px 14px;border-radius:8px;cursor:pointer}
.term button:hover{background:#2C3038}
.term code{display:block;padding:16px;font:15px/1.65 var(--mono);overflow-wrap:anywhere}
.after{margin-top:36px}
.after li{display:flex;gap:10px}
.after svg{width:18px;height:18px;flex:none;margin-top:.3em;fill:currentColor;color:var(--accent)}
.after .no-dot::before{content:none}
.after .no-dot{padding-left:0}

/* privacy */
.checks{list-style:none;margin:0 0 24px;padding:0;display:grid;gap:14px}
.pnote{margin-bottom:24px;max-width:44em}
.checks li{position:relative;padding-left:40px;font-size:19px;font-weight:650;line-height:1.5}
.checks li::before{content:"";position:absolute;left:0;top:.12em;width:26px;height:26px;border-radius:50%;background:var(--fill)}
.checks li::after{content:"";position:absolute;left:10px;top:.32em;width:6px;height:11px;border:solid var(--accent);border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
details{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:0 22px;max-width:44em}
summary{cursor:pointer;padding:16px 0;font-weight:650}
details p{margin:0 0 20px;color:var(--muted);font-size:17px}

.foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px 28px;padding-block:32px 48px;border-top:1px solid var(--line);color:var(--faint);font-size:15px}
.foot p{margin:0}
.foot .made{display:flex;align-items:center;gap:10px}
.foot img{border-radius:5px}

@media (max-width:1080px){
.hero{grid-template-columns:minmax(0,1fr);gap:48px;padding-block:56px 80px}
.hero-text{max-width:640px}
h1{font-size:clamp(40px,6.4vw,60px)}
:is(:lang(ko),:lang(ja),:lang(zh)) h1{font-size:clamp(34px,5.4vw,50px)}
.hero-shot{max-width:820px}
.docs{grid-template-columns:204px minmax(0,1fr);gap:36px}
.duo,.split{grid-template-columns:minmax(0,1fr)}
.split{gap:28px}
}
@media (max-width:900px){.bento{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
:root{--bar:56px}
body{font-size:17.5px}
.wrap{width:calc(100% - 32px)}
.bar .btn{display:none}
#lang button{padding:6px 8px}
.hero{padding-block:36px 56px;gap:36px}
h1{font-size:clamp(34px,10vw,40px)}
.btn-l{width:100%}
.hero-shot img{border-radius:18px}
.docs{display:block}
.toc{z-index:15;top:var(--bar);margin:0 -16px 36px;padding:10px 16px;background:var(--bar-bg);-webkit-backdrop-filter:saturate(1.6) blur(14px);backdrop-filter:saturate(1.6) blur(14px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;overscroll-behavior-x:contain}
.toc::-webkit-scrollbar{display:none}
.toc ol{display:flex;gap:8px;width:max-content}
.toc a{min-height:40px;padding:0 14px;gap:8px;white-space:nowrap;border-radius:999px;box-shadow:inset 0 0 0 1px var(--line)}
.toc a[aria-current]{box-shadow:none}
.toc svg{width:18px;height:18px}
section{margin-bottom:96px;scroll-margin-top:calc(var(--bar) + var(--tocbar) + 16px);min-height:calc(50vh - var(--bar) - var(--tocbar) - 108px)}
.tile{padding:20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
<a class="brand" href="#"><img src="img/icon.png?v=otter" width="28" height="28" alt=""><span>CarryOn</span></a>
<nav id="lang" data-a="langLabel"><button type="button" data-l="en" lang="en">EN</button><button type="button" data-l="ko" lang="ko">한국어</button><button type="button" data-l="ja" lang="ja">日本語</button><button type="button" data-l="zh" lang="zh">中文</button></nav>
<!-- /download counts the download, then sends it on to the newest GitHub release; its dmg asset must be named CarryOn.dmg -->
<a class="btn btn-s" href="/download"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9.5M6 9l4 4 4-4M4 16.5h12"/></svg><span data-i="dlShort"></span></a>
</div></header>
<main>
<div class="wrap hero">
<div class="hero-text">
<p class="eyebrow" data-i="eyebrow"></p>
<h1><span data-i="h1a"></span><span class="h1b" data-i="h1b"></span></h1>
<p class="lede" data-i="sub"></p>
<a class="btn btn-l" href="/download"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3v9.5M6 9l4 4 4-4M4 16.5h12"/></svg><span data-i="dl"></span></a>
<p class="meta" data-i="meta"></p>
<p class="also"><a href="https://github.com/morningverse67-wq/carryon-app" data-i="gh"></a></p>
</div>
<!-- img/<lang>-<shot>.webp: screenshots of the app with made-up demo data -->
<div class="hero-shot"><picture>
<source media="(max-width:760px) and (prefers-color-scheme:dark)" data-s="narrow-dark" width="880" height="1464">
<source media="(max-width:760px)" data-s="narrow-light" width="880" height="1464">
<source media="(prefers-color-scheme:dark)" data-s="wide-dark" width="1640" height="1464">
<img data-s="wide-light" width="1640" height="1464" alt="" data-a="heroAlt" fetchpriority="high">
</picture></div>
</div>

<div class="wrap docs">
<nav class="toc" id="toc" data-a="tocLabel"><ol>
<li><a href="#glance"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="7" opacity=".35"/><path d="M10 3a7 7 0 0 1 5.7 11"/></svg><span data-i="t1"></span></a></li>

pMore:"정확히 무엇을 읽나요",pDetail:"~/.claude, ~/.codex, ~/.aside의 세션 기록(Claude Code, Codex, Aside)을 한 줄씩 읽어 메타데이터(세션 ID, 이름, 제목, 작업 폴더, 토큰 수, 시각, 누가 누구에게 일을 넘겼는지)를 뽑아요. 제목은 첫 메시지의 앞 60자 정도일 수 있어요. 각 세션의 마지막 요청(한 줄)과, 맨 위에 보이는 세션의 최근 요청 3개·마지막 답의 끝·계획은 그 세션 기록에서 읽어 이 Mac에서만(앱이나, ‘터미널에서 열기’로 연 그 터미널에서) 보여 주고, 저장하거나 어디로 보내지 않아요. 그 밖에 할 일 메모, 프로세스 목록(어떤 세션이 어느 앱에서 실행 중인지), 그리고 ‘백업하고 메모리 정리’를 위해 로그인 셸의 PATH를 한 번 읽어요.",
foot:"AI 에이전트를 여러 개 동시에 돌리는 사람을 위해 만들었어요."},
ja:{langLabel:"言語",tocLabel:"目次",dlShort:"ダウンロード",dl:"Mac版をダウンロード",eyebrow:"macOS のメニューバーアプリ · 無料",
cleanAlt:"デモデータの「セッションの整理」画面：休止中の Claude Code セッションとそれぞれのメモリ、選んだセッションを終了するボタン、その下に 24 時間でトークンを多く読んだセッション。",
cu4:"圧縮のときはセッションの MCP サーバーをひとつも起動しません。Claude Code も Codex も同じなので、メモリの使用が少なくなります。",
cu3:"トークンの多いセッションは 24 時間に読んだトークン数とともに表示され、その行ですぐ整理できます（一度に 1 つ、ほかは順番待ち）。作業中なら「終わったら整理」を予約します。セッションは毎回会話全体を読み直すので、圧縮すると 1 回に読む量が減ります。",
cu2:"終了できるのはターミナルで始めた Claude Code のセッションだけで、起動したコマンドがまだ動いているセッションはあらかじめ選びません。",
cu1:"休止中のセッションは、確認してからだけ終了します。直前にひとつずつもう一度確かめ、強制終了ではなく通常の終了シグナル（SIGTERM）を送ります。会話は残り、「すべてのセッション」からいつでも再開できます。",
cup:"「セッションの整理」は、ターミナルで開いたまましばらく使っていない Claude Code のセッションとそれぞれのメモリ、そして直近 24 時間でトークンをいちばん多く読んだセッションを表示します。整理するものがあるときだけ「すべてのセッションを表示」の下に出ます。",
cuh:"休んでいるセッション、重いセッションを整理",
tC:"セッションの整理",
listAlt:"ホームの一覧：返事待ち 1、整理が必要 4（各行に圧縮ボタン）、実行中 5（デモデータ）。",
pNote:"「バックアップして圧縮」（または「バックアップして新しいセッションへ」）を押したときだけ、そのセッション一つのログを読みやすい .md と一緒に ~/.carryon/backups/ にコピーし、そのツール自身の /compact（claude または codex）を実行します。セッションで /compact と入力したときと同じく、圧縮がそのセッションのログに追加され、会話は要約のためにモデルの提供元に送られます。",
c5:"作業中のセッションには「バックアップして圧縮」ボタンが出ないので、作業が途中で切れません。「終わったら整理」を予約すると、作業が止まってから整理して通知します。設定で「いっぱいになったら自動で整理」をオンにすると、赤い線を超えたセッションは自動で予約されます。",c6:"ターミナルで休止中の Claude Code セッションは「閉じて整理する」で整理できます。確認すると CarryOn がいったん終了して整理し、ターミナルで開き直します。会話は残ります。",
gh:"GitHub で見る ★",
h1a:"AIセッションを、ひと目で。",h1b:"あふれる前に、そのまま続けよう。",
sub:"Claude Code・Codex・Aside の各セッションが、どれだけ埋まっているかを表示します。いっぱいに近づいたらボタンひとつでバックアップして圧縮。中断したところからそのまま続けられます。",
meta:"バージョン {v} · macOS 14以降 · Appleシリコン・Intel · 無料",
heroAlt:"デモデータの CarryOn ウィンドウ：92% でもうすぐいっぱいになるセッションが「バックアップと圧縮」ボタンと同じグループのリング付きで表示され、返事待ち・整理が必要・実行中のセッション一覧が並びます。",
t1:"ひと目で",t2:"バックアップと圧縮",t3:"やることメモ",t5:"そのほか",t6:"インストール",t7:"プライバシー",
g1h:"対応が必要なセッションをひと目で",g1p:"ホームには、返事待ち・整理が必要（60% 以上）・実行中のセッションが、カードに 1 回ずつ並びます。選んだセッションはリング付きで大きく表示されます。グループに入っていれば、カードの中にそのグループがリングで並びます。グループは仕事を任せたセッションと、そこから直接仕事を受けたセッションで、名前は任せた側のセッション名です。グループ名を押すとすべてのグループがいちばん埋まった順に % 付きで出て、+N を押すと残りのリングがその場に広がります。広いウィンドウでは一覧と横に並びます。",

lg1:"60% 未満：まだ余裕あり、実行中は緑",lg2:"60% 以上：黄色、整理が必要",lg3:"85% 以上：オレンジ、もうすぐいっぱい、通知あり",
c1h:"ボタンひとつで空きをつくる",c1p:"「バックアップして圧縮」は会話をバックアップしてから圧縮し、そのセッション自体の % を下げます。Mac アプリがパネルで実行し、各ステップとかかった時間を表示します。",
tidyAlt:"92%「もうすぐ会話がいっぱいです」のセッションと、その下の「バックアップして圧縮」パネル：各ステップが並び、最後に 92% → 18% に下がった結果が出ます（デモデータ）。",
c2l:"圧縮したばかり · 92% → 18%",c2t:"圧縮したセッションは 1 時間ホーム画面に残るので、% が下がった途端に消えることはありません。",
c3:"バックアップは 1 秒もかかりません。待つのはモデルが要約を書く時間で、長い会話なら 30 秒〜2 分ほどです。",c4:"Claude Code と Codex のセッションはその場で圧縮し、Aside のセッションは新しいセッションで続けます。元のセッションはグレーになり、カードから続きのセッションへ移れます。",
d1h:"やることメモも一緒に引き継ぐ",d1p:"セッションごとに番号付きのやることを書いておけます。「続けるときに一緒に送る」をオンにすると、圧縮後の最初のメッセージに残りが付き、新しいセッションでは先頭に入ります。",

mH:"メニューバーから",mP:"メニューバーの CarryOn をクリックするとウィンドウが開きます。右クリックすると、いちばん埋まったセッション 3 つがリングと % 付きで出て（選ぶとそのセッションを表示）、設定とアップデートの確認もあります。アップデートの確認はブラウザでリリースページを開きます。",mOpen:"CarryOn を開く",mTop:"会話量の多いセッション",mSet:"設定…",mUpd:"アップデートを確認…",

pMore:"何を読み取るのか、くわしく",pDetail:"~/.claude、~/.codex、~/.aside のセッション記録（Claude Code、Codex、Aside）を 1 行ずつ読み、メタデータ（セッション ID、名前、タイトル、作業フォルダ、トークン数、時刻、誰が誰に仕事を渡したか）を取り出します。タイトルは最初のメッセージの先頭約 60 文字になることがあります。各セッションの最後の依頼（1 行）と、いちばん上に表示中のセッションの最近の依頼 3 件・最後の返答の末尾・計画は、そのログから読んでこの Mac の中だけ（アプリか、「ターミナルで開く」で開いたそのターミナル）で表示し、保存も送信もしません。ほかに、やることメモ、プロセス一覧（どのセッションがどのアプリで実行中か）、そして「バックアップして圧縮」のためにログインシェルの PATH を一度だけ読みます。",

cleanAlt:"使用演示数据的“整理会话”界面：空闲的 Claude Code 会话及其占用的内存、关闭所选会话的按钮，下方是 24 小时内读取 token 最多的会话。",
cu4:"压缩时不会启动该会话的任何 MCP 服务器，Claude Code 和 Codex 都一样，所以占用的内存更少。",
cu3:"token 用量大的会话会显示 24 小时内读取的 token 数，可以在那一行直接整理（一次一个，其余排队）；正在工作的可以预约“完成后整理”。会话每次都会重新读取整段对话，压缩后每次读取的量会减少。",
cu2:"只能关闭在终端里启动的 Claude Code 会话；它启动的命令仍在运行的会话不会被预先选中。",
cu1:"空闲会话只有在你确认后才会关闭。关闭前会逐个再检查一次，发送普通的退出信号（SIGTERM），绝不强制结束。对话会保留，随时可以在“所有会话”里接着打开。",
cup:"“整理会话”会列出在终端里一直开着、有一阵子没用的 Claude Code 会话及其各自占用的内存，以及最近 24 小时读取 token 最多的会话。只有需要整理时，它才会出现在“显示所有会话”下方。",

const VER="1.4.3";  // the only place the version is written
const own=(o,k)=>typeof k==="string"&&Object.prototype.hasOwnProperty.call(o,k);  // no Object.hasOwn: Safari < 15.4
const $=(s,r=document)=>[...r.querySelectorAll(s)];
let cur="en",copyTimer;
$("[data-ring]").forEach(e=>{const p=e.dataset.ring;e.innerHTML='<svg viewBox="0 0 48 48" aria-hidden="true"><circle class="trk" cx="24" cy="24" r="19"/><circle class="arc" cx="24" cy="24" r="19" pathLength="100" stroke-dasharray="'+p+' 100" transform="rotate(-90 24 24)"/><text x="24" y="28.5" text-anchor="middle">'+p+"<tspan>%</tspan></text></svg>"});

// the table of contents: the section under the middle of the window is active, and a blue
// copy of its icon and label is revealed from the left as far as it has been read; at the bottom of the page the last one is full
const toc=$("#toc")[0],links=$("#toc a"),secs=links.map(a=>document.getElementById(a.hash.slice(1)));
links.forEach(a=>{const f=document.createElement("span");f.className="fill";f.setAttribute("aria-hidden","true");f.innerHTML=a.innerHTML;a.append(f)});  // before setLang fills its [data-i]
const narrow=matchMedia("(max-width:760px)"),still=matchMedia("(prefers-reduced-motion:reduce)");
let ticking=0,active=-1;
function track(){ticking=0;
const mid=innerHeight/2,end=innerHeight+scrollY>=document.documentElement.scrollHeight-2,tops=secs.map(s=>s.getBoundingClientRect().top);
let i=-1;tops.forEach((t,k)=>{if(t<=mid)i=k});  // a section runs from its top to the next one's, so the gap between them counts as read
if(end)i=secs.length-1;
const p=end?1:i<0?0:Math.min(1,Math.max(0,(mid-tops[i])/((i+1<secs.length?tops[i+1]:secs[i].getBoundingClientRect().bottom)-tops[i])));
links.forEach((a,k)=>{const on=k===i;a.style.setProperty("--p",on?p.toFixed(3):0);a.classList.toggle("read",on&&p>0);if(on)a.setAttribute("aria-current","true");else a.removeAttribute("aria-current")});
if(i!==active){active=i;if(i>=0)center(links[i])}}
function center(a){if(narrow.matches)toc.scrollTo({left:a.offsetLeft-(toc.clientWidth-a.offsetWidth)/2,behavior:still.matches?"auto":"smooth"})}  // the chip bar keeps a chip in view
const soon=()=>{if(!ticking)ticking=requestAnimationFrame(track)};
addEventListener("scroll",soon,{passive:true});addEventListener("resize",soon);
toc.addEventListener("focusin",e=>center(e.target));

function setLang(l){cur=l;const d=I18N[l];document.documentElement.lang=l;
$("[data-i]").forEach(e=>e.textContent=d[e.dataset.i].replace("{v}",VER));
$("[data-v]").forEach(e=>e.textContent=VER);
$("[data-h]").forEach(e=>e.innerHTML=d[e.dataset.h]);
$("[data-a]").forEach(e=>e.setAttribute(e.tagName==="IMG"?"alt":"aria-label",d[e.dataset.a]));
$("[data-s]").forEach(e=>e[e.tagName==="SOURCE"?"srcset":"src"]="img/"+l+"-"+e.dataset.s+".webp");
$("#copy")[0].textContent=d.copy;
$("#copy-status")[0].textContent="";
$("#lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
try{localStorage.lang=l}catch(e){}
active=-1;soon()}
function pick(){let s;try{s=new URLSearchParams(location.search).get("lang")}catch(e){}
if(own(I18N,s))return s;  // ?lang=en|ko|ja|zh in the address comes first: a link can say which language it opens in
try{s=localStorage.lang}catch(e){}
if(own(I18N,s))return s;
for(const n of navigator.languages||[navigator.language||"en"]){const c=n.slice(0,2).toLowerCase();if(own(I18N,c))return c}
return"en"}
$("#lang button").forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$("#copy")[0].onclick=async function(){const cmd=$("#cmd")[0],t=cmd.textContent;let copied=false;
try{await navigator.clipboard.writeText(t);copied=true}catch(e){const r=document.createRange();r.selectNodeContents(cmd);const s=getSelection();s.removeAllRanges();s.addRange(r);try{copied=document.execCommand("copy")}catch(_){}}
this.textContent=copied?I18N[cur].copied:I18N[cur].copy;
$("#copy-status")[0].textContent=copied?I18N[cur].copied:I18N[cur].copyFailed;
clearTimeout(copyTimer);copyTimer=setTimeout(()=>this.textContent=I18N[cur].copy,1800)};
setLang(pick());
// count this visit (/api/hit on this site): the path, where it came from (the host only, never this site) and the language shown; no cookies
{let r="";try{r=new URL(document.referrer).hostname}catch(e){}
try{navigator.sendBeacon("/api/hit",JSON.stringify({p:location.pathname,r:r===location.hostname?"":r,l:cur}))}catch(e){}}
</script>
